<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Example: Bouncing Ball</title>
  <style>
    html, body { margin: 0; height: 100%; background: #1d1b19; overflow: hidden; }
    canvas { display: block; width: 100%; height: 100%; }
  </style>
</head>
<body>
  <canvas id="c" width="960" height="540"></canvas>
  <script>
    // Placeholder animation: a squash-and-stretch bounce with multiplane parallax.
    // The camera tracks right, so nearer planes slide left faster.
    var canvas = document.getElementById('c');
    var ctx = canvas.getContext('2d');
    var W = canvas.width, H = canvas.height;
    var GROUND = 430;

    // Periodic ridge line so each plane wraps seamlessly.
    function ridge(x, base, amp, seed) {
      return base
        - amp * Math.sin(x * 0.004 + seed)
        - amp * 0.5 * Math.sin(x * 0.011 + seed * 2)
        - amp * 0.25 * Math.sin(x * 0.023 + seed * 3);
    }

    function drawRidge(offset, base, amp, seed, color) {
      ctx.fillStyle = color;
      ctx.beginPath();
      ctx.moveTo(0, H);
      for (var x = 0; x <= W; x += 8) ctx.lineTo(x, ridge(x + offset, base, amp, seed));
      ctx.lineTo(W, H);
      ctx.fill();
    }

    function drawTrees(offset, spacing, y, size, color) {
      ctx.fillStyle = color;
      var start = -((offset % spacing) + spacing) % spacing;
      for (var x = start - spacing; x < W + spacing; x += spacing) {
        var i = Math.round((x + offset) / spacing);
        var s = size * (0.75 + 0.5 * Math.abs(Math.sin(i * 12.9898)));
        ctx.beginPath();
        ctx.moveTo(x, y - s * 2.2);
        ctx.lineTo(x - s * 0.7, y);
        ctx.lineTo(x + s * 0.7, y);
        ctx.fill();
      }
    }

    function drawGrass(offset, spacing, color) {
      ctx.strokeStyle = color;
      ctx.lineWidth = 5;
      ctx.lineCap = 'round';
      var start = -((offset % spacing) + spacing) % spacing;
      for (var x = start - spacing; x < W + spacing; x += spacing) {
        var i = Math.round((x + offset) / spacing);
        var h = 40 + 50 * Math.abs(Math.sin(i * 78.233));
        for (var k = -1; k <= 1; k++) {
          ctx.beginPath();
          ctx.moveTo(x + k * 8, H + 10);
          ctx.quadraticCurveTo(x + k * 10, H - h * 0.5, x + k * 22, H - h);
          ctx.stroke();
        }
      }
    }

    var BALL_X = W * 0.42, R = 34, APEX = 230, PERIOD = 1.1;

    function drawBall(t) {
      var p = (t % PERIOD) / PERIOD;          // 0 and 1 = contact, 0.5 = apex
      var height = APEX * 4 * p * (1 - p);
      var speed = Math.abs(1 - 2 * p);        // fastest near the ground

      // Stretch along the fall, squash at contact, keeping area roughly constant.
      var sy = 1 + 0.25 * speed * speed;
      var contact = Math.min(p, 1 - p);
      if (contact < 0.05) sy = 0.65 + 7 * contact;
      var sx = 1 / sy;
      var cy = GROUND - height - R * sy;

      // Shadow shrinks as the ball rises.
      var shadow = 1 - height / (APEX * 1.6);
      ctx.fillStyle = 'rgba(20, 30, 20, ' + (0.35 * shadow) + ')';
      ctx.beginPath();
      ctx.ellipse(BALL_X, GROUND + 4, R * 1.2 * shadow * sx * 1.2, 7 * shadow, 0, 0, Math.PI * 2);
      ctx.fill();

      ctx.save();
      ctx.translate(BALL_X, cy);
      ctx.scale(sx, sy);
      var g = ctx.createRadialGradient(-R * 0.35, -R * 0.4, R * 0.1, 0, 0, R);
      g.addColorStop(0, '#ff8a6a');
      g.addColorStop(1, '#c0392b');
      ctx.fillStyle = g;
      ctx.beginPath();
      ctx.arc(0, 0, R, 0, Math.PI * 2);
      ctx.fill();
      ctx.lineWidth = 3;
      ctx.strokeStyle = '#5a1a12';
      ctx.stroke();
      ctx.restore();
    }

    var t0 = null;
    function frame(now) {
      if (t0 === null) t0 = now;
      var t = (now - t0) / 1000;
      var cam = t * 160;                       // camera position in world units

      var sky = ctx.createLinearGradient(0, 0, 0, H);
      sky.addColorStop(0, '#f3c98b');
      sky.addColorStop(1, '#f8e7c9');
      ctx.fillStyle = sky;
      ctx.fillRect(0, 0, W, H);

      drawRidge(cam * 0.08, 260, 40, 1.0, '#c9b39a');   // distant mountains
      drawRidge(cam * 0.25, 340, 35, 4.0, '#9fae84');   // midground hills
      drawTrees(cam * 0.5, 90, 400, 28, '#5f7a4f');      // tree line
      drawRidge(cam * 1.0, GROUND, 4, 7.0, '#7d9a5c');   // ground under the ball
      drawBall(t);
      drawGrass(cam * 1.8, 140, '#3e5a30');              // foreground, crosses the lens

      requestAnimationFrame(frame);
    }
    requestAnimationFrame(frame);
  </script>
</body>
</html>
