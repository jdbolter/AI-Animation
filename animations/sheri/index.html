<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Happy Birthday, Sheri</title>
  <style>
    html, body { margin: 0; height: 100%; background: #000; overflow: hidden; }
    canvas { display: block; cursor: pointer; }
  </style>
</head>
<body>
<canvas id="c"></canvas>
<script>
// Happy Birthday, Sheri: an animated birthday card from Jay and David, drawn in canvas.
// A single stand-alone file: no other files or network needed.
// Characters and effects are drawn "on twos" (12 drawings a second) with boiling ink lines;
// backgrounds are painted once and stay still; the camera moves smoothly through the planes.
// Add ?t=SECONDS to the URL to hold a single frame. Click to pause; it plays once, then click to watch again.

const W = 1280, H = 720;
const cvs = document.getElementById('c');
let ctx = cvs.getContext('2d');
let VIEW = { k: 1, ox: 0, oy: 0 };

const INK = '#2a2420', SKIN = '#e9c9a8';
const HAND = '"Snell Roundhand","Apple Chancery","Segoe Script","Brush Script MT",cursive';
const SERIF = '"Iowan Old Style","Palatino Linotype",Palatino,Georgia,serif';

// ---------- math ----------
const clamp = (v, a = 0, b = 1) => Math.max(a, Math.min(b, v));
const lerp = (a, b, f) => a + (b - a) * f;
const ease = f => { f = clamp(f); return f * f * (3 - 2 * f); };
const easeOut = f => { f = clamp(f); return 1 - (1 - f) ** 3; };
const seg = (u, a, b) => clamp((u - a) / (b - a));
const mid = (a, b) => [(a[0] + b[0]) / 2, (a[1] + b[1]) / 2];
const twos = u => Math.floor(u * 12) / 12;
function mix(a, b, f) { return Array.isArray(a) ? a.map((x, i) => x + (b[i] - x) * f) : a + (b - a) * f; }
// Exposure-sheet keys: [[time, value], ...], eased between neighbours.
function K(u, keys, e = ease) {
  if (u <= keys[0][0]) return keys[0][1];
  for (let i = 1; i < keys.length; i++) {
    if (u < keys[i][0]) {
      const [a, va] = keys[i - 1], [b, vb] = keys[i];
      return mix(va, vb, e((u - a) / (b - a)));
    }
  }
  return keys[keys.length - 1][1];
}
function R(seed) {
  let a = seed >>> 0;
  return () => {
    a = a + 0x6D2B79F5 | 0;
    let t = Math.imul(a ^ a >>> 15, 1 | a);
    t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
    return ((t ^ t >>> 14) >>> 0) / 4294967296;
  };
}
function shade(h, a) {
  const n = parseInt(h.slice(1), 16);
  let r = n >> 16, g = n >> 8 & 255, b = n & 255;
  const t = a < 0 ? 0 : 255, p = Math.abs(a);
  r = Math.round(r + (t - r) * p); g = Math.round(g + (t - g) * p); b = Math.round(b + (t - b) * p);
  return `rgb(${r},${g},${b})`;
}

// ---------- ink ----------
let BOIL = 0;
function jitterPts(pts, amt, r) { return pts.map(p => [p[0] + (r() - .5) * 2 * amt, p[1] + (r() - .5) * 2 * amt]); }
function tracePath(p, close, sharp) {
  ctx.beginPath();
  if (sharp || p.length < 3) {
    ctx.moveTo(p[0][0], p[0][1]);
    for (let i = 1; i < p.length; i++) ctx.lineTo(p[i][0], p[i][1]);
    if (close) ctx.closePath();
    return;
  }
  if (close) {
    const n = p.length; const m = mid(p[n - 1], p[0]);
    ctx.moveTo(m[0], m[1]);
    for (let i = 0; i < n; i++) { const q = p[i], m2 = mid(q, p[(i + 1) % n]); ctx.quadraticCurveTo(q[0], q[1], m2[0], m2[1]); }
    ctx.closePath();
  } else {
    ctx.moveTo(p[0][0], p[0][1]);
    for (let i = 1; i < p.length - 1; i++) { const m = mid(p[i], p[i + 1]); ctx.quadraticCurveTo(p[i][0], p[i][1], m[0], m[1]); }
    const l = p[p.length - 1]; ctx.lineTo(l[0], l[1]);
  }
}
// A hand-inked shape. Fill and line get separate jitter, like paint laid under a drawn line.
// Lines "boil" (redraw slightly differently) unless o.still is set.
function ink(pts, o = {}) {
  const id = o.id || 1, j = o.j ?? 1.1, seed = o.still ? id * 7919 : id * 7919 + BOIL * 104729;
  const close = o.close ?? !!o.fill;
  if (o.fill) { tracePath(jitterPts(pts, j * .8, R(seed + 17)), true, o.sharp); ctx.fillStyle = o.fill; ctx.fill(); }
  if (o.stroke !== false) {
    tracePath(jitterPts(pts, j, R(seed)), close, o.sharp);
    ctx.strokeStyle = o.stroke || INK; ctx.lineWidth = o.w || 2; ctx.lineCap = 'round'; ctx.lineJoin = 'round'; ctx.stroke();
  }
}
function ellPts(c, rx, ry, n = 12) { const p = []; for (let i = 0; i < n; i++) { const a = i / n * Math.PI * 2; p.push([c[0] + Math.cos(a) * rx, c[1] + Math.sin(a) * ry]); } return p; }
function limb(pts, w, col, id) { ink(pts, { w: w + 3.2, stroke: INK, id }); ink(pts, { w, stroke: col, id }); }
function hand(p, skin, s, id) { ink(ellPts(p, 5.5 * s, 5 * s, 8), { fill: skin, w: 1.6, id }); }
function dabs(x, y, w, h, col, n, seed, r0 = 6, r1 = 20, a = .25) {
  const r = R(seed); ctx.save(); ctx.globalAlpha = a; ctx.fillStyle = col;
  for (let i = 0; i < n; i++) {
    const cx = x + r() * w, cy = y + r() * h, rx = lerp(r0, r1, r()), ry = rx * lerp(.3, .7, r());
    ctx.beginPath(); ctx.ellipse(cx, cy, rx, ry, (r() - .5) * .6, 0, Math.PI * 2); ctx.fill();
  }
  ctx.restore();
}
function writeOn(text, x, y, prog) {
  const w = ctx.measureText(text).width;
  if (prog <= 0) return x;
  if (prog >= 1) { ctx.fillText(text, x, y); return x + w; }
  ctx.save(); ctx.beginPath(); ctx.rect(x - 6, y - 60, w * prog + 6, 90); ctx.clip(); ctx.fillText(text, x, y); ctx.restore();
  return x + w * prog;
}

// ---------- multiplane camera ----------
// p is the plane's depth factor: 1 = character plane, <1 = farther, >1 = nearer the lens.
let CAM = { x: W / 2, y: H / 2, z: 1 };
function layer(p, fn) {
  ctx.save();
  const z = 1 + (CAM.z - 1) * p;
  ctx.translate(W / 2, H / 2); ctx.scale(z, z);
  ctx.translate(-(W / 2 + (CAM.x - W / 2) * p), -(H / 2 + (CAM.y - H / 2) * p));
  fn();
  ctx.restore();
}


// ---------- characters ----------
function ikE(S, T, a, b, bend) {
  const dx = T[0] - S[0], dy = T[1] - S[1];
  const dd = clamp(Math.hypot(dx, dy), Math.abs(a - b) + 1, a + b - .5);
  const ang = Math.atan2(dy, dx);
  const A = Math.acos(clamp((a * a + dd * dd - b * b) / (2 * a * dd), -1, 1));
  const e = ang + bend * A;
  return [S[0] + Math.cos(e) * a, S[1] + Math.sin(e) * a];
}
// Build a side-view skeleton. Construction order follows the prompt: line of action (lean),
// pelvis, ribcage, head, then limbs solved toward hand targets.
function rig(o) {
  const s = o.s || 1, d = o.dir || 1, lean = o.lean || 0, hip = [o.x, o.y];
  const a = d * lean, ca = Math.cos(a), sa = Math.sin(a);
  const L = (lx, ly) => { const X = d * lx * s, Y = ly * s; return [hip[0] + X * ca - Y * sa, hip[1] + X * sa + Y * ca]; };
  const sh = L(0, -80), neck = L(2, -90);
  const ha = d * (lean + (o.head || 0)), ch = Math.cos(ha), shh = Math.sin(ha);
  const rot = (base, lx, ly) => { const X = d * lx * s, Y = ly * s; return [base[0] + X * ch - Y * shh, base[1] + X * shh + Y * ch]; };
  const hc = rot(neck, 4, -24);
  const Hh = (lx, ly) => rot(hc, lx, ly);
  const legs = [];
  if (o.seated) {
    const knee = [hip[0] + d * 50 * s, hip[1] - (o.kneeUp ?? 12) * s];
    const foot = [knee[0] + d * 6 * s, hip[1] + (o.seatH ?? 48) * s];
    legs.push([hip, knee, foot], [[hip[0] - d * 4 * s, hip[1]], [knee[0] - d * 8 * s, knee[1] + 2 * s], [foot[0] - d * 12 * s, foot[1]]]);
  } else {
    const ph = o.walk || 0, st = o.stride || 0;
    for (const k of [0, 1]) {
      const p = ph + k * Math.PI;
      const a1 = Math.sin(p) * .38 * st;
      const bend = Math.max(0, Math.sin(p - 1.3)) * .7 * st;
      const kn = [hip[0] + d * Math.sin(a1) * 50 * s, hip[1] + Math.cos(a1) * 50 * s];
      const a2 = a1 - bend;
      legs.push([hip, kn, [kn[0] + d * Math.sin(a2) * 52 * s, kn[1] + Math.cos(a2) * 52 * s]]);
    }
  }
  const up = 44 * s, fo = 42 * s;
  const arm = (T, sign) => {
    if (!T) T = [sh[0] + d * (4 + sign * Math.sin(o.walk || 0) * 14 * (o.stride || 0)) * s, sh[1] + 82 * s];
    const e1 = ikE(sh, T, up, fo, 1), e2 = ikE(sh, T, up, fo, -1);
    const el = e1[1] > e2[1] ? e1 : e2;
    const dx = T[0] - el[0], dy = T[1] - el[1], dl = Math.hypot(dx, dy) || 1;
    return [sh, el, [el[0] + dx / dl * fo, el[1] + dy / dl * fo]];
  };
  return { s, d, hip, sh, neck, hc, Hh, L, legs, armF: arm(o.handF, 1), armB: arm(o.handB, -1) };
}
function drawHead(o, r, id) {
  const H = r.Hh, s = r.s, skin = o.skin || SKIN, hc = o.hairC || '#3a2a20';
  if (o.hair === 'bun') ink(ellPts(H(-19, -8), 9 * s, 9 * s, 10), { fill: hc, id: id + 1, w: 1.6 });
  ink([H(-18, -2), H(-17, -15), H(-8, -23), H(6, -23), H(15, -16), H(18, -7), H(19, -2), H(24, 5), H(18, 8), H(18, 13), H(13, 19), H(3, 20), H(-9, 15)], { fill: skin, id: id + 2, w: 2 });
  if (o.hair === 'bun') ink([H(-19, 2), H(-20, -14), H(-10, -24), H(5, -25), H(15, -18), H(8, -16), H(-2, -15), H(-8, -9), H(-12, 3)], { fill: hc, id: id + 3, w: 1.6 });
  if (o.hair === 'long') ink([H(-19, 4), H(-21, -14), H(-10, -25), H(6, -26), H(16, -18), H(11, -16), H(3, -18), H(-4, -13), H(-8, -2), H(-6, 14), H(-9, 25), H(-21, 22)], { fill: hc, id: id + 3, w: 1.6 });
  if (o.hair === 'short') ink([H(-19, 3), H(-20, -15), H(-9, -25), H(7, -25), H(17, -17), H(11, -17), H(2, -18), H(-6, -12), H(-10, 2)], { fill: hc, id: id + 3, w: 1.6 });
  ink(ellPts(H(-5, 1), 3.5 * s, 5.5 * s, 8), { fill: shade(skin, -.1), id: id + 4, w: 1.3 });
  const e = H(10, -3); ctx.fillStyle = INK; ctx.beginPath(); ctx.arc(e[0], e[1], 1.9 * s, 0, 7); ctx.fill();
  ink([H(6, -9), H(13, -10)], { w: 1.6 * s, id: id + 5 });
  ink([H(14, 13), H(17, 13)], { w: 1.3 * s, id: id + 6 });
  if (o.glasses) { ink(ellPts(H(11, -3), 6 * s, 5 * s, 10), { stroke: '#2a221c', close: true, w: 1.6, id: id + 7 }); ink([H(5, -3), H(-4, -3)], { w: 1.3, id: id + 8 }); }
  if (o.hat === 'cloche') ink([H(-22, -2), H(-21, -17), H(-11, -28), H(7, -28), H(18, -19), H(25, -9), H(12, -11), H(-6, -9), H(-14, -2)], { fill: o.hatC || '#3e3236', id: id + 9, w: 1.8 });
  if (o.hat === 'bowler') { ink(ellPts(H(0, -22), 15 * s, 11 * s, 10), { fill: o.hatC || '#1e1c1b', id: id + 9, w: 1.6 }); ink([H(-21, -14), H(22, -14)], { w: 4 * s, stroke: o.hatC || '#1e1c1b', id: id + 10 }); }
  if (o.hat === 'cap') ink([H(-19, -10), H(-18, -24), H(10, -26), H(18, -14), H(30, -12), H(16, -9), H(-12, -8)], { fill: o.hatC || '#1f2733', id: id + 9, w: 1.6 });
}
function drawArmF(o, r) { const id = o.id * 100 + 60; limb(r.armF, 10.5 * r.s, o.sleeve || o.c, id); hand(r.armF[2], o.skin || SKIN, r.s, id + 1); }
function drawPerson(o, r) {
  const s = r.s, d = r.d, id = o.id * 100 + 7, skin = o.skin || SKIN, legC = o.legC || '#38332f', sl = o.sleeve || o.c;
  const shoe = (p, k) => ink(ellPts([p[0] + d * 6 * s, p[1] - 3 * s], 11 * s, 5 * s, 8), { fill: '#1f1b18', id: id + k, w: 1.5 });
  limb(r.legs[1], 11 * s, shade(legC, -.25), id + 1); shoe(r.legs[1][2], 2);
  limb(r.armB, 10.5 * s, shade(sl, -.22), id + 3); hand(r.armB[2], shade(skin, -.08), s, id + 4);
  limb(r.legs[0], 12 * s, legC, id + 5); shoe(r.legs[0][2], 6);
  limb([r.neck, r.Hh(-3, 16)], 9 * s, skin, id + 8);
  const hf = o.hem ?? 10, hb = hf + (o.hemSkew || 0), L = r.L;
  ink([L(-15, hb), L(-18, -28), L(-16, -70), L(-8, -86), L(6, -88), L(14, -78), L(18, -45), L(19, hf), L(2, hf + 3)], { fill: o.c, id: id + 9, w: 2.2 });
  drawHead(o, r, id + 20);
  if (!o.noArmF) drawArmF(o, r);
}

// ---------- props ----------
function chair(hx, hy, d, floor, id) {
  const c = '#6a4d35', dk = '#4c3624';
  ink([[hx - d * 24, hy + 8], [hx - d * 30, hy - 48]], { w: 5, stroke: dk, still: true, id: id + 3 });
  ink([[hx - d * 27, hy - 44], [hx - d * 34, hy - 40], [hx - d * 31, hy - 20], [hx - d * 24, hy - 24]], { fill: c, still: true, id: id + 4, w: 1.6 });
  ink([[hx - d * 26, hy + 6], [hx + d * 18, hy + 6], [hx + d * 18, hy + 13], [hx - d * 26, hy + 13]], { fill: c, sharp: true, still: true, id, w: 1.8 });
  ink([[hx - d * 22, hy + 13], [hx - d * 22, floor]], { w: 4, stroke: dk, still: true, id: id + 1 });
  ink([[hx + d * 14, hy + 13], [hx + d * 14, floor]], { w: 4, stroke: dk, still: true, id: id + 2 });
}
function desk(cx, floor, d, id) {
  const t = floor - 80;
  ink([[cx + d * 44, t + 30], [cx + d * 42, floor - 4]], { w: 4, stroke: '#4c3624', still: true, id });
  ink([[cx - d * 52, t + 30], [cx - d * 50, floor]], { w: 5, stroke: '#5a412b', still: true, id: id + 1 });
  ink([[cx + d * 52, t + 30], [cx + d * 50, floor]], { w: 5, stroke: '#5a412b', still: true, id: id + 2 });
  ink([[cx - 56, t + 8], [cx + 56, t + 8], [cx + 54, t + 32], [cx - 54, t + 32]], { fill: '#6e5238', sharp: true, still: true, id: id + 3, w: 2 });
  ink([[cx - d * 60, t + 6], [cx + d * 60, t - 4], [cx + d * 60, t + 4], [cx - d * 60, t + 12]], { fill: '#8c6a48', sharp: true, still: true, id: id + 4, w: 2 });
  ink(ellPts([cx + d * 40, t - 8], 6, 7, 8), { fill: '#222', still: true, id: id + 5, w: 1.5 });
  ink([[cx - d * 30, t + 3], [cx + d * 18, t - 2], [cx + d * 20, t + 1], [cx - d * 28, t + 7]], { fill: '#efe4cb', sharp: true, still: true, id: id + 6, w: 1.2 });
}
function seatedAtDesk(P, pose, floor, deskCx) {
  const o = { ...P, ...pose };
  const r = rig(o);
  chair(o.x, o.y, o.dir, floor, o.id * 50 + 500);
  drawPerson({ ...o, noArmF: true }, r);
  desk(deskCx, floor, o.dir, o.id * 50 + 520);
  drawArmF(o, r);
  return r;
}
function heldPaper(p, ang, id) {
  ctx.save(); ctx.translate(p[0], p[1]); ctx.rotate(ang);
  ink([[-15, -26], [15, -24], [16, 18], [-14, 20]], { fill: '#efe5cd', sharp: true, id, w: 1.5 });
  ctx.restore();
}
function polyPart(pts, f) {
  let total = 0; for (let i = 1; i < pts.length; i++) total += Math.hypot(pts[i][0] - pts[i - 1][0], pts[i][1] - pts[i - 1][1]);
  let left = total * f; const out = [pts[0]];
  for (let i = 1; i < pts.length && left > 0; i++) {
    const L = Math.hypot(pts[i][0] - pts[i - 1][0], pts[i][1] - pts[i - 1][1]);
    if (left >= L) { out.push(pts[i]); left -= L; } else { const t = left / L; out.push([lerp(pts[i - 1][0], pts[i][0], t), lerp(pts[i - 1][1], pts[i][1], t)]); left = 0; }
  }
  return out;
}
function roundRect(x, y, w, h, r) { ctx.beginPath(); ctx.moveTo(x + r, y); ctx.arcTo(x + w, y, x + w, y + h, r); ctx.arcTo(x + w, y + h, x, y + h, r); ctx.arcTo(x, y + h, x, y, r); ctx.arcTo(x, y, x + w, y, r); ctx.closePath(); }
const easeIn = f => { f = clamp(f); return f * f * f; };
const UI = '"Helvetica Neue",Helvetica,Arial,sans-serif';
const FL = 650, INKC = '#2a2420', GREY = '#8a8478';
const VIEWER = { id: 40, c: '#4a6a7a', legC: '#33373c', hair: 'short', hairC: '#3a2c22', hem: 24 };
const WOMAN = { id: 41, c: '#8a5a68', legC: '#3a3436', hair: 'bun', hairC: '#2e2018', hem: 40 };

function paper(col = '#ece4d2', seed = 1) { ctx.fillStyle = col; ctx.fillRect(-600, -600, W + 1200, H + 1200); dabs(-500, -500, W + 1000, H + 1000, shade(col, .08), 40, seed, 40, 160, .35); }
function label(t, x, y, size = 18, col = INKC, align = 'left', font = UI, weight = '') { ctx.save(); ctx.font = `${weight} ${size}px ${font}`; ctx.fillStyle = col; ctx.textAlign = align; ctx.fillText(t, x, y); ctx.restore(); }
function handText(t, x, y, size, col, p = 1, center = false) { ctx.save(); ctx.font = size + 'px ' + HAND; ctx.fillStyle = col; const w = ctx.measureText(t).width; writeOn(t, center ? x - w / 2 : x, y, p); ctx.restore(); }
function fadeIn(q, a, d = .5) { return ease(seg(q, a, a + d)); }
function alpha(a, fn) { if (a <= 0) return; ctx.save(); ctx.globalAlpha *= Math.min(1, a); fn(); ctx.restore(); }
function chapter(num, title) {
  return u => {
    CAM = { x: 640, y: 360, z: 1 + u * .012 };
    layer(0, () => paper('#2a2622', 7));
    layer(1, () => {
      alpha(fadeIn(u, .2, .8), () => label(num, 640, 300, 30, '#bfb3a0', 'center', SERIF, 'italic'));
      hand(title, 640, 390, 58, '#efe6d2', ease(seg(u, .6, 3.2)), true);
    });
  };
}
// Catmull-Rom through key points, sampled densely; returns a polyline.
function spline(pts, n = 12) {
  const out = [];
  for (let i = 0; i < pts.length - 1; i++) {
    const p0 = pts[Math.max(0, i - 1)], p1 = pts[i], p2 = pts[i + 1], p3 = pts[Math.min(pts.length - 1, i + 2)];
    for (let k = 0; k < n; k++) {
      const t = k / n, t2 = t * t, t3 = t2 * t;
      out.push([0, 1].map(j => .5 * (2 * p1[j] + (-p0[j] + p2[j]) * t + (2 * p0[j] - 5 * p1[j] + 4 * p2[j] - p3[j]) * t2 + (-p0[j] + 3 * p1[j] - 3 * p2[j] + p3[j]) * t3)));
    }
  }
  out.push(pts[pts.length - 1]);
  return out;
}
function along(poly, f) { const p = polyPart(poly, clamp(f)); return p[p.length - 1]; }
function lerpColor(a, b, f) { const A = parseInt(a.slice(1), 16), B = parseInt(b.slice(1), 16); const c = [16, 8, 0].map(s => Math.round(lerp(A >> s & 255, B >> s & 255, f))); return `rgb(${c[0]},${c[1]},${c[2]})`; }
function halo(x, y, r, a) { if (a <= 0) return; ctx.save(); const g = ctx.createRadialGradient(x, y, r * .6, x, y, r * 1.5); g.addColorStop(0, `rgba(255,214,120,${.55 * a})`); g.addColorStop(1, 'rgba(255,214,120,0)'); ctx.fillStyle = g; ctx.beginPath(); ctx.arc(x, y, r * 1.5, 0, 7); ctx.fill(); ctx.restore(); }
function star(x, y, r, col, rot = 0) {
  ctx.save(); ctx.translate(x, y); ctx.rotate(rot); ctx.fillStyle = col; ctx.beginPath();
  for (let k = 0; k < 10; k++) { const a = k * Math.PI / 5, rr = k % 2 ? r * .45 : r; ctx.lineTo(Math.cos(a) * rr, Math.sin(a) * rr); }
  ctx.closePath(); ctx.fill(); ctx.restore();
}

// ---------- the card's world ----------
const GOLD = '#d9a441', EUC = '#8fa892', EUCD = '#5f7a66', TILE = '#c48a5c';
const SHERI = { id: 20, c: '#c9705a', legC: '#3e4c68', hair: 'bun', hairC: '#7a5236', skin: '#eac6a4', hem: 34 };
const PK = 1.3, PF = 560;   // the patio is drawn at 1.3x, its floor on screen y 560

function skyGrad(top, bot, y0 = -400, y1 = 520) { const g = ctx.createLinearGradient(0, y0, 0, y1); g.addColorStop(0, top); g.addColorStop(1, bot); ctx.fillStyle = g; ctx.fillRect(-800, -800, W + 1600, H + 1600); }

// Sheri's performance on the patio: walk in, turn, sit, sip, look up at the trees.
function sheriOnPatio(q, T, o = {}) {
  const walkEnd = 3.3, turn = walkEnd + .25, sitA = T[0] + .2, sitB = sitA + 1;
  const P = { ...SHERI };
  if (q < turn) {
    const f = seg(q, 0, walkEnd), x = lerp(-80, 572, f < 1 ? f : 1);
    const st = q < walkEnd ? 1 : 1 - seg(q, walkEnd, turn);
    const op = { ...P, x, y: -104, dir: 1, walk: x / 22, stride: st, head: 0 };
    let r = rig(op); const hand0 = [r.sh[0] + 20, r.sh[1] + 30];
    r = rig({ ...op, handF: hand0 }); drawPerson({ ...op, handF: hand0 }, r); mug(r.armF[2], 2050, 1, q);
    return;
  }
  if (q < sitA + .45) {
    // turned, back to the chair; leans forward in anticipation of sitting
    const a = seg(q, sitA, sitA + .45);
    const op = { ...P, x: 572 + a * 8, y: -104 + a * 6, dir: -1, lean: .3 * a, head: -.05 };
    let r = rig(op); const hand0 = [r.sh[0] - 20, r.sh[1] + 32];
    r = rig({ ...op, handF: hand0 }); drawPerson({ ...op, handF: hand0 }, r); mug(r.armF[2], 2050, 1, q);
    return;
  }
  const s = ease(seg(q, sitA + .45, sitB)), land = Math.sin(seg(q, sitB, sitB + .4) * Math.PI) * 3;
  const sip = Math.sin(seg(q, T[0] + 2.4, T[0] + 5) * Math.PI) ** .6;
  const up = ease(seg(q, T[1] + .3, T[1] + 1.4)) * (1 - ease(seg(q, T[2] - 1.2, T[2]))), toScreen = o.toScreen || 0;
  const hip = [lerp(580, 640, s), lerp(-90, -58, s) + land];
  const op = { ...P, x: hip[0], y: hip[1], dir: -1, seated: true, kneeUp: lerp(-24, 6, s), seatH: 0, lean: lerp(.25, -.08, s), head: -.32 * up + .12 * toScreen };
  op.seatH = -hip[1] + op.kneeUp;
  let r = rig(op);
  const lap = [hip[0] - 34, hip[1] - 30], mouth = r.Hh(20, 12);
  const hf = [lerp(lap[0], mouth[0] - 4, sip), lerp(lap[1], mouth[1] + 8, sip)];
  r = rig({ ...op, handF: hf, handB: [hip[0] - 30, hip[1] - 22] });
  drawPerson({ ...op, handF: hf, handB: [hip[0] - 30, hip[1] - 22] }, r);
  mug(r.armF[2], 2050, 1 - sip * .6, q);
  // a smile, once she has settled
  const H2 = r.Hh; alpha(seg(q, sitB, sitB + 1), () => ink([H2(12, 12), H2(15, 14.5), H2(18, 13)], { w: 1.4, id: 2060 }));
}

// The film playing on the laptop: a message crossing the ocean. e: 0..1 how far it has flown.

    () => { skyGrad('#8cc0e0', '#e8f0e0', -46, 26); ctx.fillStyle = '#d9c08a'; ctx.fillRect(-40, 10, 80, 20); palm(6, 14, .3, 5300, 0); },
    () => { skyGrad('#a8c8e0', '#f0e6d0', -46, 26); ctx.fillStyle = '#8a9aa8'; ctx.beginPath(); ctx.moveTo(-40, 26); ctx.lineTo(-14, -20); ctx.lineTo(4, 0); ctx.lineTo(20, -26); ctx.lineTo(40, 26); ctx.fill(); },
    () => { ctx.fillStyle = '#f0d8d8'; ctx.fillRect(-40, -46, 80, 80); ctx.fillStyle = '#f6efe6'; ctx.fillRect(-24, -2, 48, 22); ctx.fillStyle = '#e07a9a'; ctx.fillRect(-24, -6, 48, 6); ctx.fillStyle = '#f2c94c'; ctx.fillRect(-2, -20, 4, 14); ctx.fillStyle = '#ff9a3a'; ctx.beginPath(); ctx.arc(0, -23, 3, 0, 7); ctx.fill(); },
    () => { ctx.fillStyle = '#3a3050'; ctx.fillRect(-40, -46, 80, 80); for (const [cx, a] of [[-8, .3], [8, -.3]]) { ctx.save(); ctx.translate(cx, 0); ctx.rotate(a); ctx.strokeStyle = '#f4e6c8'; ctx.lineWidth = 2; ctx.beginPath(); ctx.moveTo(-6, -16); ctx.lineTo(6, -16); ctx.lineTo(0, 0); ctx.closePath(); ctx.stroke(); ctx.beginPath(); ctx.moveTo(0, 0); ctx.lineTo(0, 14); ctx.stroke(); ctx.restore(); } star(0, -26, 6, '#f2c94c', 0); }
  ];
  sc[i % sc.length]();
  ctx.restore(); ctx.restore();
}
function shotMemories(u, T) {
  const q = twos(u);
  CAM = { x: 640, y: 340, z: K(u, [[0, 1.0], [T[1] + 2, 1.05]]) };
  layer(0, () => { skyGrad('#f6e4c4', '#efc98e', 0, H); dabs(-200, -200, W + 400, H + 400, '#f8ecd4', 30, 6001, 40, 160, .4); });
  layer(1, () => {
    const open = ease(seg(q, .3, 1.2)), out = ease(seg(q, 1, 2.6)), gather = ease(seg(q, T[0] + 2.2, T[1] - .4));
    const ex = 640, ey = 380;
    const N = 12;
    // places spaced evenly along the heart's outline (by length, so they don't bunch at the notch)
    const curve = []; for (let k = 0; k <= 240; k++) { const t = Math.PI * 2 * k / 240; curve.push([640 + 16 * Math.sin(t) ** 3 * 15, 270 - (13 * Math.cos(t) - 5 * Math.cos(2 * t) - 2 * Math.cos(3 * t) - Math.cos(4 * t)) * 15]); }
    const hp = k => along(curve, k / N);
    for (let k = 0; k < N; k++) {
      const fan = [ex + (k - 5.5) * 96, ey - 150 + (k % 2) * 44], h = hp(k);
      const x = lerp(lerp(ex, fan[0], out), h[0], gather), y = lerp(lerp(ey - 10, fan[1], out), h[1], gather);
      const rot = lerp((k - 5.5) * .06, (k - 5.5) * .02, gather) + Math.sin(q * 1.2 + k) * .02;
      if (out > 0) snapshot(k, x, y, rot, lerp(.4, .8, out) * lerp(1, .72, gather), 6100 + k * 10);
    }
    alpha(1 - gather, () => envelope(ex, ey + 40, 2.2, 0, open, 6200));
    const hg = fadeIn(q, T[1] - .6, .8);
    if (hg > 0) { const s = 22 * (1 + Math.sin(q * 3) * .05 * hg); alpha(hg, () => heartShape(640, 262, (s * 4) * hg + 1, '#d04a4a', 6300, hg)); }
  });
  warmLight(.2);
}

// ---------- 5. the card ----------
function sprig(x, y, ang, s, id, q) {
  ctx.save(); ctx.translate(x, y); ctx.rotate(ang + Math.sin(q * .9) * .03); ctx.scale(s, s);
  ink(spline([[0, 0], [60, 10], [130, 6], [200, 20]], 6), { w: 3, stroke: '#8a7a6a', id });
  for (let k = 0; k < 9; k++) { const t = k / 9, p = along(spline([[0, 0], [60, 10], [130, 6], [200, 20]], 6), t); leaf(p[0], p[1], 46 - k * 2, (k % 2 ? .9 : -.9) + .2, k % 3 ? EUC : '#a3b8a0', id + 1 + k, .32); }
  ctx.restore();
}
function shotCard(u) {
  const q = twos(u);
  CAM = { x: 640, y: 360, z: K(u, [[0, 1.04], [12, 1.0]]) };
  layer(0, () => { skyGrad('#fbf0da', '#f1d39c', 0, H); dabs(-200, -200, W + 400, H + 400, '#fdf6e6', 30, 7001, 40, 180, .45); halo(640, 300, 260, .35); });
  layer(.9, () => { sprig(-20, 60, .25, 1.4, 7100, q); sprig(W + 20, H - 80, Math.PI + .25, 1.4, 7120, q + 2); });
  layer(1, () => {
    handText('Happy Birthday, Sheri.', 640, 320, 92, '#a8742a', ease(seg(u, .6, 4.4)), true);
    handText('Love Jay and David', 640, 430, 50, '#7a5a3a', ease(seg(u, 4.8, 7.4)), true);
    alpha(fadeIn(u, 7.4, 1), () => heartShape(640, 500, 16, '#d04a4a', 7200, .4 + Math.sin(q * 2) * .1));
    for (let k = 0; k < 14; k++) { const r = R(7300 + k), tw = Math.sin(q * 2 + k * 2.1); if (tw > .2) star(r() * W, r() * H * .8, 4 + 4 * tw, 'rgba(240,200,110,.8)', q + k); }
  });
  driftLeaves(q, 4, 7400, .8);
}

// ---------- the exposure sheet ----------
// Captions are laid end to end: each starts `pre` seconds into its shot (plus any extra pause
// given as [pause, text]) and stays up for its reading time. Each shot receives T, the start
// time of every caption (and, last, the end of the final one), and keys its action to them.
const SHOTS = [
  { draw: shotDawn, pre: 4, tail: 2, caps: ['The morning sun crested the hills of El Cajon, casting a warm, golden glow across Sheri’s patio.', 'It was the kind of perfect Southern California day that felt like a quiet celebration all its own.'] },
  { draw: shotPatio, pre: 3.6, tail: 1.5, caps: ['As she settled into her favorite chair with a fresh cup of coffee,', 'the rustle of the nearby eucalyptus trees seemed to convey the gentle peace.'] },
  { draw: shotScreen, pre: .8, tail: 1, caps: ['Resting on the table beside her, her computer screen played this birthday message from Jay and David,'] },
  { draw: shotOcean, pre: .5, tail: 1.2, caps: ['a reminder sent across the ocean that no matter the distance,'] },
  { draw: shotMemories, pre: .6, tail: 3, caps: ['a lifetime of shared memories is always close to the heart.'] },
  { draw: shotCard, dur: 14 },
];

// Reading time for an English caption (about 175 words a minute). Each shot's action is
// keyed to its captions' start times, so a caption is simply given its reading time.
const READ = text => 1.2 + text.split(/\s+/).length / 2.9, STRETCH = 1;
for (const S of SHOTS) {
  S.realCaps = []; S.T = [];
  let a = S.pre || 0;
  for (const c of S.caps || []) {
    const [pause, text] = Array.isArray(c) ? c : [0, c];
    a += pause;
    const b = a + READ(text) * STRETCH;
    S.realCaps.push([a, b, text]); S.T.push(a);
    a = b + .4;
  }
  S.T.push(a);
  // A quiet beat after a shot's last caption, so the images can breathe.
  S.real = S.caps ? a + (S.tail ?? 3.2) : S.dur;
}
const TOTAL = SHOTS.reduce((a, s) => a + s.real, 0);

function wrap(text, max) {
  const words = text.split(' '), lines = []; let line = '';
  for (const w of words) { const t = line ? line + ' ' + w : w; if (ctx.measureText(t).width > max && line) { lines.push(line); line = w; } else line = t; }
  if (line) lines.push(line);
  return lines;
}
function caption(text, a) {
  ctx.save(); ctx.globalAlpha = a;
  const g = ctx.createLinearGradient(0, H - 200, 0, H); g.addColorStop(0, 'rgba(15,12,10,0)'); g.addColorStop(.5, 'rgba(15,12,10,.5)'); g.addColorStop(1, 'rgba(15,12,10,.75)');
  ctx.fillStyle = g; ctx.fillRect(0, H - 200, W, 200);
  ctx.font = 'italic 27px ' + SERIF; ctx.textAlign = 'center'; ctx.textBaseline = 'alphabetic';
  const lines = wrap(text, 1000); let y = H - 46 - (lines.length - 1) * 36;
  ctx.shadowColor = 'rgba(0,0,0,.8)'; ctx.shadowBlur = 8; ctx.fillStyle = '#f5ecdb';
  for (const l of lines) { ctx.fillText(l, W / 2, y); y += 36; }
  ctx.restore();
}
const GRAIN = [0, 1, 2].map(k => {
  const c = document.createElement('canvas'); c.width = 320; c.height = 180;
  const g = c.getContext('2d'), im = g.createImageData(320, 180), r = R(55 + k);
  for (let i = 0; i < im.data.length; i += 4) { const v = 205 + r() * 50; im.data[i] = v; im.data[i + 1] = v * .985; im.data[i + 2] = v * .95; im.data[i + 3] = 255; }
  g.putImageData(im, 0, 0); return c;
});

function render(t) {
  BOIL = Math.floor(t * 8);
  let acc = 0, i = 0;
  while (i < SHOTS.length - 1 && t >= acc + SHOTS[i].real) { acc += SHOTS[i].real; i++; }
  const S = SHOTS[i], r = t - acc;
  ctx.setTransform(1, 0, 0, 1, 0, 0); ctx.globalAlpha = 1; ctx.globalCompositeOperation = 'source-over';
  ctx.fillStyle = '#000'; ctx.fillRect(0, 0, cvs.width, cvs.height);
  ctx.setTransform(VIEW.k, 0, 0, VIEW.k, VIEW.ox, VIEW.oy);
  ctx.save(); ctx.beginPath(); ctx.rect(0, 0, W, H); ctx.clip();
  ctx.save(); S.draw(r, S.T); ctx.restore();
  ctx.save(); ctx.globalCompositeOperation = 'multiply'; ctx.globalAlpha = .45; ctx.drawImage(GRAIN[BOIL % 3], 0, 0, W, H); ctx.restore();
  const v = ctx.createRadialGradient(W / 2, H / 2, H * .45, W / 2, H / 2, H * 1.05);
  v.addColorStop(0, 'rgba(0,0,0,0)'); v.addColorStop(1, 'rgba(10,6,3,.45)'); ctx.fillStyle = v; ctx.fillRect(0, 0, W, H);
  const fade = Math.max(0, 1 - r / .5, 1 - (S.real - r) / .5);
  if (fade > 0) { ctx.fillStyle = `rgba(18,15,12,${fade})`; ctx.fillRect(0, 0, W, H); }
  for (const [a, b, text] of S.realCaps) {
    if (r > a && r < b) caption(text, Math.min(1, (r - a) / .35, (b - r) / .35));
  }
  ctx.restore();
}

function resize() {
  const dpr = Math.min(window.devicePixelRatio || 1, 2), cw = innerWidth, ch = innerHeight;
  cvs.width = Math.round(cw * dpr); cvs.height = Math.round(ch * dpr);
  cvs.style.width = cw + 'px'; cvs.style.height = ch + 'px';
  const k = Math.min(cw / W, ch / H) * dpr;
  VIEW = { k, ox: (cvs.width - W * k) / 2, oy: (cvs.height - H * k) / 2 };
}
const FIX = new URLSearchParams(location.search).get('t');
if (new URLSearchParams(location.search).has('debug')) { let a = 0; console.log('TOTAL ' + TOTAL.toFixed(1) + ' starts ' + SHOTS.map(S => { const x = a; a += S.real; return x.toFixed(1); }).join(',')); }
let clock = 0, last = null, paused = false;
let ended = false;
function frame(now) {
  if (last !== null && !paused && !ended) clock += Math.min(.1, (now - last) / 1000);
  last = now;
  if (clock >= TOTAL - .001) { clock = TOTAL - .001; ended = true; }
  render(clock);
  if (ended) endCard();
  requestAnimationFrame(frame);
}
// The film plays once and stops on its last (faded) frame with an offer to watch again.
function endCard() {
  ctx.setTransform(VIEW.k, 0, 0, VIEW.k, VIEW.ox, VIEW.oy);
  ctx.save(); ctx.font = 'italic 34px ' + SERIF; ctx.textAlign = 'center'; ctx.fillStyle = '#f5ecdb';
  ctx.fillText('↻  Watch again', W / 2, H / 2 + 12); ctx.restore();
}
function toggle() { if (ended) { clock = 0; ended = false; paused = false; } else paused = !paused; }
addEventListener('resize', () => { resize(); if (FIX !== null) render(parseFloat(FIX)); });
addEventListener('click', toggle);
addEventListener('keydown', e => { if (e.key === ' ') { toggle(); e.preventDefault(); } });
resize();
// A held frame is redrawn for its first second, in case the page is still being sized.
let held = 0;
function hold() { resize(); render(parseFloat(FIX)); if (++held < 60) requestAnimationFrame(hold); }
if (FIX !== null) hold(); else requestAnimationFrame(frame);
</script>
