<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Turn to Channel 9</title>
  <style>
    html, body { margin: 0; height: 100%; background: #000; overflow: hidden; }
    canvas { display: block; cursor: pointer; }
  </style>
</head>
<body>
<canvas id="c"></canvas>
<script>
// Turn to Channel 9: an alternate history of the American grade school, in which television
// took the place of the textbook. A multiplane cartoon drawn in canvas.
// Characters are drawn "on twos" (12 drawings a second) with boiling ink lines; the classroom
// is built in a simple perspective so that the same room can be seen again in 1985 and 2026.
// Add ?t=SECONDS to the URL to hold a single frame. Click to pause; it plays once, then click to watch again.

const W = 1280, H = 720;
const cvs = document.getElementById('c');
let ctx = cvs.getContext('2d');
let VIEW = { k: 1, ox: 0, oy: 0 };

const INK = '#2a2420', SKIN = '#e9c9a8';
const SERIF = '"Iowan Old Style","Palatino Linotype",Palatino,Georgia,serif';
const CHALK = '"Chalkboard SE","Chalkboard","Comic Sans MS",cursive';
const UI = '"Helvetica Neue",Helvetica,Arial,sans-serif';
const PENCIL = '"Bradley Hand","Chalkboard SE","Comic Sans MS",cursive';

// ---------- math ----------
const clamp = (v, a = 0, b = 1) => Math.max(a, Math.min(b, v));
const lerp = (a, b, f) => a + (b - a) * f;
const ease = f => { f = clamp(f); return f * f * (3 - 2 * f); };
const easeOut = f => { f = clamp(f); return 1 - (1 - f) ** 3; };
const easeIn = f => { f = clamp(f); return f * f * f; };
const seg = (u, a, b) => clamp((u - a) / (b - a));
const mid = (a, b) => [(a[0] + b[0]) / 2, (a[1] + b[1]) / 2];
const twos = u => Math.floor(u * 12) / 12;
const frac = x => x - Math.floor(x);
const bell = (u, a, b) => Math.sin(seg(u, a, b) * Math.PI);
function mix(a, b, f) { return Array.isArray(a) ? a.map((x, i) => x + (b[i] - x) * f) : a + (b - a) * f; }
// Exposure-sheet keys: [[time, value], ...], eased between neighbours.
function K(u, keys, e = ease) {
  if (u <= keys[0][0]) return keys[0][1];
  for (let i = 1; i < keys.length; i++) {
    if (u < keys[i][0]) {
      const [a, va] = keys[i - 1], [b, vb] = keys[i];
      return mix(va, vb, e((u - a) / (b - a)));

  return keys[keys.length - 1][1];
}
function R(seed) {
  let a = seed >>> 0;
  return () => {
    a = a + 0x6D2B79F5 | 0;
    let t = Math.imul(a ^ a >>> 15, 1 | a);
    t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
    return ((t ^ t >>> 14) >>> 0) / 4294967296;
  };
}
function rgb(h) { const n = parseInt(h.slice(1), 16); return [n >> 16, n >> 8 & 255, n & 255]; }
function shade(h, a) {
  let [r, g, b] = rgb(h);
  const t = a < 0 ? 0 : 255, p = Math.abs(a);
  r = Math.round(r + (t - r) * p); g = Math.round(g + (t - g) * p); b = Math.round(b + (t - b) * p);
  return '#' + [r, g, b].map(v => v.toString(16).padStart(2, '0')).join('');
}
function mixC(a, b, f) { const x = rgb(a), y = rgb(b); return '#' + x.map((v, i) => Math.round(v + (y[i] - v) * clamp(f)).toString(16).padStart(2, '0')).join(''); }

// ---------- ink ----------
let BOIL = 0;
function jitterPts(pts, amt, r) { return pts.map(p => [p[0] + (r() - .5) * 2 * amt, p[1] + (r() - .5) * 2 * amt]); }
function tracePath(p, close, sharp) {

    ctx.moveTo(p[0][0], p[0][1]);
    for (let i = 1; i < p.length; i++) ctx.lineTo(p[i][0], p[i][1]);
    if (close) ctx.closePath();
    return;
  }
  if (close) {
    const n = p.length; const m = mid(p[n - 1], p[0]);
    ctx.moveTo(m[0], m[1]);
    for (let i = 0; i < n; i++) { const q = p[i], m2 = mid(q, p[(i + 1) % n]); ctx.quadraticCurveTo(q[0], q[1], m2[0], m2[1]); }
    ctx.closePath();

    ctx.moveTo(p[0][0], p[0][1]);
    for (let i = 1; i < p.length - 1; i++) { const m = mid(p[i], p[i + 1]); ctx.quadraticCurveTo(p[i][0], p[i][1], m[0], m[1]); }

}
// A hand-inked shape. Fill and line get separate jitter, like paint laid under a drawn line.
// Lines "boil" (redraw slightly differently) unless o.still is set.
function ink(pts, o = {}) {
  const id = o.id || 1, j = o.j ?? 1.1, seed = o.still ? id * 7919 : id * 7919 + BOIL * 104729;

  if (o.fill) { tracePath(jitterPts(pts, j * .8, R(seed + 17)), true, o.sharp); ctx.fillStyle = o.fill; ctx.fill(); }

    tracePath(jitterPts(pts, j, R(seed)), close, o.sharp);
    ctx.strokeStyle = o.stroke || INK; ctx.lineWidth = o.w || 2; ctx.lineCap = 'round'; ctx.lineJoin = 'round'; ctx.stroke();
  }
}
function ellPts(c, rx, ry, n = 12) { const p = []; for (let i = 0; i < n; i++) { const a = i / n * Math.PI * 2; p.push([c[0] + Math.cos(a) * rx, c[1] + Math.sin(a) * ry]); } return p; }
function arcPts(c, rx, ry, a0, a1, n = 16) { const p = []; for (let i = 0; i <= n; i++) { const a = lerp(a0, a1, i / n); p.push([c[0] + Math.cos(a) * rx, c[1] + Math.sin(a) * ry]); } return p; }
function limb(pts, w, col, id) { ink(pts, { w: w + 3.2, stroke: INK, id }); ink(pts, { w, stroke: col, id }); }
function hand(p, skin, s, id) { ink(ellPts(p, 5.5 * s, 5 * s, 8), { fill: skin, w: 1.6, id }); }
function quad(a, b, c, d, fill, id, o = {}) { ink([a, b, c, d], { fill, sharp: true, still: true, id, w: o.w ?? 1.6, stroke: o.stroke, j: o.j ?? .6 }); }
function dabs(x, y, w, h, col, n, seed, r0 = 6, r1 = 20, a = .25) {
  const r = R(seed); ctx.save(); ctx.globalAlpha = a; ctx.fillStyle = col;
  for (let i = 0; i < n; i++) {
    const cx = x + r() * w, cy = y + r() * h, rx = lerp(r0, r1, r()), ry = rx * lerp(.3, .7, r());
    ctx.beginPath(); ctx.ellipse(cx, cy, rx, ry, (r() - .5) * .6, 0, Math.PI * 2); ctx.fill();
  }
  ctx.restore();
}
function writeOn(text, x, y, prog, align = 'left') {
  const w = ctx.measureText(text).width;
  if (prog <= 0) return;
  const x0 = align === 'center' ? x - w / 2 : x;
  ctx.save(); ctx.textAlign = 'left'; ctx.beginPath(); ctx.rect(x0 - 6, y - 200, w * prog + 6, 260); ctx.clip(); ctx.fillText(text, x0, y); ctx.restore();
}
function polyPart(pts, f) {
  let total = 0; for (let i = 1; i < pts.length; i++) total += Math.hypot(pts[i][0] - pts[i - 1][0], pts[i][1] - pts[i - 1][1]);
  let left = total * clamp(f); const out = [pts[0]];
  for (let i = 1; i < pts.length && left > 0; i++) {
    const L = Math.hypot(pts[i][0] - pts[i - 1][0], pts[i][1] - pts[i - 1][1]);
    if (left >= L) { out.push(pts[i]); left -= L; } else { const t = left / L; out.push([lerp(pts[i - 1][0], pts[i][0], t), lerp(pts[i - 1][1], pts[i][1], t)]); left = 0; }
  }

}
function roundRect(x, y, w, h, r) { ctx.beginPath(); ctx.moveTo(x + r, y); ctx.arcTo(x + w, y, x + w, y + h, r); ctx.arcTo(x + w, y + h, x, y + h, r); ctx.arcTo(x, y + h, x, y, r); ctx.arcTo(x, y, x + w, y, r); ctx.closePath(); }

// ---------- multiplane camera (flat shots) ----------
// p is the plane's depth factor: 1 = character plane, <1 = farther, >1 = nearer the lens.
let CAM = { x: W / 2, y: H / 2, z: 1 };
function layer(p, fn) {
  ctx.save();
  const z = 1 + (CAM.z - 1) * p;
  ctx.translate(W / 2, H / 2); ctx.scale(z, z);
  ctx.translate(-(W / 2 + (CAM.x - W / 2) * p), -(H / 2 + (CAM.y - H / 2) * p));
  fn();
  ctx.restore();
}
// ---------- the classroom camera ----------
// The classroom is the same room in 1962, 1985 and 2026, so it is built in centimetres and
// projected: X across, Y down (floor at +150, ceiling at -170), Z away from the back of the room
// (front wall at 1000). Moving the camera in Z gives true parallax between the rows.
const FOC = 900, VX = W / 2, VY = 300;
let C3 = { x: 0, y: 0, z: 0 };
function P3(X, Y, Z) { const k = FOC / Math.max(20, Z - C3.z); return [VX + (X - C3.x) * k, VY + (Y - C3.y) * k, k]; }

// ---------- people (side view) ----------
function ikE(S, T, a, b, bend) {
  const dx = T[0] - S[0], dy = T[1] - S[1];
  const dd = clamp(Math.hypot(dx, dy), Math.abs(a - b) + 1, a + b - .5);
  const ang = Math.atan2(dy, dx);
  const A = Math.acos(clamp((a * a + dd * dd - b * b) / (2 * a * dd), -1, 1));
  const e = ang + bend * A;
  return [S[0] + Math.cos(e) * a, S[1] + Math.sin(e) * a];
}
// Build a side-view skeleton: line of action (lean), pelvis, ribcage, head, then limbs solved
// toward hand targets. Children use the same body with a bigger head (hs) and shorter torso and limbs.
function rig(o) {
  const s = o.s || 1, d = o.dir || 1, lean = o.lean || 0, hip = [o.x, o.y], hs = o.hs || 1, tl = o.tl || 1, lg = o.lg || 1;
  const a = d * lean, ca = Math.cos(a), sa = Math.sin(a);
  const L = (lx, ly) => { const X = d * lx * s, Y = (ly < 0 ? ly * tl : ly) * s; return [hip[0] + X * ca - Y * sa, hip[1] + X * sa + Y * ca]; };
  const sh = L(0, -80), neck = L(2, -90);
  const ha = d * (lean + (o.head || 0)), ch = Math.cos(ha), shh = Math.sin(ha);
  const rot = (base, lx, ly) => { const X = d * lx * s * hs, Y = ly * s * hs; return [base[0] + X * ch - Y * shh, base[1] + X * shh + Y * ch]; };
  const hc = rot(neck, 4, -(o.nk || 24));
  const Hh = (lx, ly) => rot(hc, lx, ly);
  const legs = [], l1 = 50 * s * lg, l2 = 52 * s * lg;
  if (o.seated) {
    const knee = [hip[0] + d * l1, hip[1] - (o.kneeUp ?? 12) * s];
    const foot = [knee[0] + d * 6 * s, hip[1] + (o.seatH ?? 48) * s * lg];
    legs.push([hip, knee, foot], [[hip[0] - d * 4 * s, hip[1]], [knee[0] - d * 8 * s, knee[1] + 2 * s], [foot[0] - d * 12 * s, foot[1]]]);
  } else if (o.kneel) {
    const fl = o.floor;
    const fk = [hip[0] + d * l1 * .8, hip[1] - 4 * s], ff = [fk[0] + d * 4 * s, fl];
    const bk = [hip[0] + d * 6 * s, fl - 5 * s], bf = [bk[0] - d * l2 * .95, fl - 6 * s];
    legs.push([hip, fk, ff], [[hip[0] - d * 4 * s, hip[1]], bk, bf]);
  } else {
    const ph = o.walk || 0, st = o.stride || 0;
    for (const k of [0, 1]) {
      const p = ph + k * Math.PI;
      const a1 = Math.sin(p) * .38 * st;
      const bend = Math.max(0, Math.sin(p - 1.3)) * .7 * st;
      const kn = [hip[0] + d * Math.sin(a1) * l1, hip[1] + Math.cos(a1) * l1];
      const a2 = a1 - bend;
      legs.push([hip, kn, [kn[0] + d * Math.sin(a2) * l2, kn[1] + Math.cos(a2) * l2]]);

    const e1 = ikE(sh, T, up, fo, 1), e2 = ikE(sh, T, up, fo, -1);
    const el = o.elbowUp ? (e1[1] < e2[1] ? e1 : e2) : (e1[1] > e2[1] ? e1 : e2);
    const dx = T[0] - el[0], dy = T[1] - el[1], dl = Math.hypot(dx, dy) || 1;

}
function hairBack(o, H, s, id) {
  const hc = o.hairC || '#3a2a20', st = o.hair;
  if (st === 'bun') ink(ellPts(H(-19, -8), 9 * s, 9 * s, 10), { fill: hc, id: id + 1, w: 1.6 });
  if (st === 'braids') {
    for (const k of [0, 1]) ink([H(-14 - k * 4, 0), H(-17 - k * 5, 14), H(-15 - k * 6, 28), H(-17 - k * 6, 38)], { w: 6.5 * s, stroke: shade(hc, -.12 * k), id: id + 11 + k });
    ink(ellPts(H(-17, 38), 4 * s, 3 * s, 6), { fill: '#e8e2d0', id: id + 13, w: 1.2 });
  }

  if (st === 'perm') ink(ellPts(H(-6, -6), 27 * s, 25 * s, 14), { fill: hc, id: id + 1, w: 1.8, j: 2 });
  if (st === 'curly') ink(ellPts(H(-8, -10), 26 * s, 24 * s, 14), { fill: hc, id: id + 1, w: 1.8, j: 2.4 });
  if (st === 'bob') ink([H(-20, 14), H(-24, -6), H(-12, -27), H(8, -27), H(20, -14), H(14, -6), H(2, -12), H(-8, 0), H(-8, 16)], { fill: hc, id: id + 1, w: 1.6 });
}
function drawHead(o, r, id) {
  const H = r.Hh, s = r.s * r.hs, skin = o.skin || SKIN, hc = o.hairC || '#3a2a20', st = o.hair;
  hairBack(o, H, s, id);
  ink([H(-18, -2), H(-17, -15), H(-8, -23), H(6, -23), H(15, -16), H(18, -7), H(19, -2), H(23, 5), H(18, 8), H(18, 13), H(13, 19), H(3, 20), H(-9, 15)], { fill: skin, id: id + 2, w: 2 });
  const cap = [H(-19, 3), H(-20, -15), H(-9, -25), H(7, -25), H(17, -17), H(11, -17), H(2, -18), H(-6, -12), H(-10, 2)];
  if (st === 'bun' || st === 'braids' || st === 'pony') ink([H(-19, 2), H(-20, -14), H(-10, -24), H(5, -25), H(15, -18), H(8, -16), H(-2, -15), H(-8, -9), H(-12, 3)], { fill: hc, id: id + 3, w: 1.6 });

  if (st === 'bob') ink([H(-19, 10), H(-21, -12), H(-9, -26), H(8, -26), H(19, -15), H(12, -12), H(2, -15), H(-7, -6), H(-7, 12)], { fill: hc, id: id + 3, w: 1.6 });
  ink(ellPts(H(-5, 1), 3.5 * s, 5.5 * s, 8), { fill: shade(skin, -.1), id: id + 4, w: 1.3 });

  else { ctx.fillStyle = INK; ctx.beginPath(); ctx.arc(e[0], e[1], 1.9 * s, 0, 7); ctx.fill(); }

  else if (o.mouth === 'open') ink(ellPts(H(16, 13), 2.2 * s, 2.6 * s, 8), { fill: '#5a2a24', id: id + 6, w: 1.2 });
  else if (o.mouth === 'frown') ink([H(12, 14), H(15, 12.5), H(18, 14)], { w: 1.3 * s, id: id + 6 });

  if (o.hat === 'cap') ink([H(-19, -10), H(-18, -24), H(10, -26), H(18, -14), H(30, -12), H(16, -9), H(-12, -8)], { fill: o.hatC || '#1f2733', id: id + 9, w: 1.6 });

}
function drawArmF(o, r) { const id = o.id * 100 + 60; limb(r.armF, 10.5 * r.s, o.sleeve || o.c, id); hand(r.armF[2], o.skin || SKIN, r.s, id + 1); }
function drawPerson(o, r) {

  const shoe = (p, k) => ink(ellPts([p[0] + d * 6 * s, p[1] - 3 * s], 11 * s, 5 * s, 8), { fill: o.shoe || '#1f1b18', id: id + k, w: 1.5 });

function person(o) { const r = rig(o); drawPerson(o, r); return r; }

// ---------- people (from behind, and face on) ----------
// A seated child seen from the back of the room. x,y is the base of the neck, k pixels per cm.
function kidBack(x, y, k, o) {
  const id = o.id || 1, w = Math.max(1.1, k * .8), hc = o.hairC || '#4a3424', skin = o.skin || SKIN;

  if (o.straps) for (const sx of [-1, 1]) ink([[sx * 7 * k, 2 * k], [sx * 8 * k, 46 * k]], { w: 2.4 * k, stroke: o.straps, id: id + 20 + sx });

  for (const sx of [-1, 1]) ink(ellPts([sx * 9.6 * k, hy + 1 * k], 2.4 * k, 3.6 * k, 8), { fill: shade(skin, -.06), id: id + 2 + sx, w });

// Reading time: every caption stays up long enough to read (about 175 words a minute).
// Where the action under a caption is shorter than that, it first plays slower (up to
// STRETCH times), then holds its last pose for whatever time is still needed.
const READ = text => 1.2 + text.split(/\s+/).length / 2.9, STRETCH = 1.5;
for (const S of SHOTS) {
  const knots = [[0, 0]]; let real = 0, story = 0;
  S.realCaps = [];
  for (const [a, b, text] of S.caps) {
    real += a - story; story = a; knots.push([story, real]);
    const ra = real, avail = b - a, need = READ(text), k = Math.min(STRETCH, Math.max(1, need / avail));

// Map time on the screen to time in the shot's own action.
function storyTime(S, r) {

}

function resize() {

  cvs.width = Math.round(cw * dpr); cvs.height = Math.round(ch * dpr);
  cvs.style.width = cw + 'px'; cvs.style.height = ch + 'px';
  const k = Math.min(cw / W, ch / H) * dpr;

const FIX = new URLSearchParams(location.search).get('t');
if (new URLSearchParams(location.search).has('debug')) { let a = 0; document.title = 'TOTAL ' + TOTAL.toFixed(1) + ' starts ' + SHOTS.map(S => { const x = a; a += S.real; return x.toFixed(1); }).join(','); console.log(document.title); }
let clock = 0, last = null, paused = false;
let ended = false;
function frame(now) {
  if (last !== null && !paused && !ended) clock += Math.min(.1, (now - last) / 1000);
  last = now;
  if (clock >= TOTAL - .001) { clock = TOTAL - .001; ended = true; }
  render(clock);
  if (ended) endCard();
  requestAnimationFrame(frame);
}
// The film plays once and stops on its last (faded) frame with an offer to watch again.
function endCard() {
  ctx.setTransform(VIEW.k, 0, 0, VIEW.k, VIEW.ox, VIEW.oy);
  ctx.save(); ctx.font = 'italic 34px ' + SERIF; ctx.textAlign = 'center'; ctx.fillStyle = '#f5ecdb';
  ctx.fillText('↻  Watch again', W / 2, H / 2 + 12); ctx.restore();

function toggle() { if (ended) { clock = 0; ended = false; paused = false; } else paused = !paused; }
addEventListener('resize', () => { resize(); if (FIX !== null) render(parseFloat(FIX)); });
addEventListener('click', toggle);
addEventListener('keydown', e => { if (e.key === ' ') { toggle(); e.preventDefault(); } });
resize();
// A held frame is redrawn for its first second, in case the page is still being sized.
let held = 0;
function hold() { resize(); render(parseFloat(FIX)); if (++held < 60) requestAnimationFrame(hold); }
if (FIX !== null) hold(); else requestAnimationFrame(frame);
