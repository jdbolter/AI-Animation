const RAW=[{"kind": "title", "text": [], "min": 8}, {"kind": "library", "text": ["On her last afternoon at the library, Helen emptied the drawer everyone had always called hers.", "There were rubber bands that broke when she stretched them, a spectacle case without spectacles, and three photographs of the staff standing beside different Christmas trees. At the bottom lay a folded map.", "Martin had given it to her."], "min": 0}, {"kind": "memory", "text": ["He used to go walking on Sundays. On Mondays he came in with mud still caught in the seams of his boots and described places Helen had never heard of, though most were less than an hour away.", "“You’d like this one,” he would say.", "For a while, he had asked her to come.", "There had been reasons not to. Her mother needed groceries. The garden had got away from her. Once, the forecast was rain.", "“Another Sunday,” Helen always said.", "Eventually he began telling her about the walks without suggesting she join him. She had found this easier."], "min": 0}, {"kind": "map", "text": ["The map was of the coast. In blue ink he had marked a route from a village called Bellwick to a ruined chapel. Beside the bus stop he had written:", "8.10 out. 6.40 back. Café does a decent lunch."], "min": 0}, {"kind": "cards", "text": ["Martin had left the library eleven years ago to live near his daughter.", "They exchanged Christmas cards until his arrived one February with an apology about his eyesight.", "Helen had written back in larger letters.", "There had been no card the following year."], "min": 0}, {"kind": "handbag", "text": ["She put the map in her handbag."], "min": 7}, {"kind": "clock", "text": ["On Sunday she woke before the alarm."], "min": 7}, {"kind": "packing", "text": ["It took her some time to find the small rucksack she had bought for a holiday and never used again.", "She packed a cheese sandwich, an apple, and a cardigan."], "min": 15}, {"kind": "bus", "text": ["The bus now left at eight twenty-five."], "min": 13}, {"kind": "village", "text": ["Bellwick was smaller than she had imagined. The café was still there, but it sold candles and expensive soap. She stood outside it for a moment, looking through the window at a woman arranging pale green bottles."], "min": 0}, {"kind": "path", "text": ["The path began behind the church.", "At first Helen walked too quickly. Then her knee started to ache, and she slowed down. People passed her in pairs, carrying walking sticks or calling to dogs. Most said good morning. She answered each of them."], "min": 0}, {"kind": "chapel", "text": ["At the chapel there were three walls and a notice asking visitors not to climb them. Helen sat on a low stretch of stone and ate her sandwich.", "She tried to remember Martin’s voice.", "She could remember the things he said: that the buses were unreliable, that proper socks mattered more than expensive boots, that he had once seen a seal from this very headland. But the voice itself would not come."], "min": 0}, {"kind": "children", "text": ["Below her, the tide was out. Two children crossed the exposed sand, stopping frequently to examine things."], "min": 0}, {"kind": "cold", "text": ["She stayed until she felt cold."], "min": 8}, {"kind": "tea", "text": ["On the way back, she bought a cup of tea from a van beside the church. The young man serving asked whether she’d had a good walk.", "“Yes,” she said. “Lovely.”"], "min": 0}, {"kind": "end", "text": ["At the bus stop she unfolded the map to check the route she had taken. A breeze lifted one corner, and she put her palm over it.", "She turned the map over.", "The back was blank.", "She had expected, somehow, to find more of his writing."], "min": 30}];

function audioTick(){if(!ac)return;let s=shotAt(time),u=time-s.start,outdoor=['bus','village','path','chapel','children','cold','tea','end'].includes(s.kind);windGain.gain.setTargetAtTime(playing&&!muted&&outdoor?.045+.02*Math.sin(time*.3):0,ac.currentTime,.2);droneGain.gain.setTargetAtTime(playing&&!muted&&s.kind==='chapel'?.008:0,ac.currentTime,.3);engineGain.gain.setTargetAtTime(playing&&!muted&&s.kind==='bus'?.035*(1-ramp(u,s.dur*.5,s.dur*.9)):0,ac.currentTime,.2);
 let cueId=Math.floor(time*4);if(cueId===lastCue||!playing||muted)return;lastCue=cueId;if(u<.3){if(['title','map','cards'].includes(s.kind)){note(220,.9,.07);note(329.63,1.3,.035)}if(s.kind==='end')rustle(.8,.1,1800)}
 if(s.kind==='path'&&walkState(u).moving&&cueId%(u<6.2?2:4)===0)rustle(.09,.10,450);if(s.kind==='library'){let q=u-cue('library','There were rubber');if(q>2.1&&q<2.35)note(310,.12,.07);if(q>3.8&&q<4.05)note(760,.10,.04);if(q>7.4&&q<9.3&&cueId%2===0)rustle(.18,.05,1900)}if(s.kind==='clock'&&u>2.7&&u<2.95)note(680,.12,.035);if(s.kind==='end'&&u>3&&u<7&&cueId%2===0)rustle(.18,.04,2200);if(s.kind==='end'&&u>cue('end','She turned')+.3&&u<cue('end','She turned')+2.6&&cueId%2===0)rustle(.2,.06,1700);if(s.kind==='tea'&&u>2&&u<2.4)note(920,.3,.035);
}
function tick(stamp){if(playing){if(lastStamp)time=Math.min(total,time+(stamp-lastStamp)/1000);if(time>=total)playing=false}lastStamp=stamp;let f=Math.floor(time*FPS);if(f!==lastFrame){render(time);lastFrame=f;updateUI()}audioTick();requestAnimationFrame(tick)}
async function toggle(){if(still)return;if(!started){started=true;start.style.display='none';soundButton.hidden=false;audioInit()}if(time>=total)time=0;playing=!playing;if(ac)await ac.resume();lastStamp=0;updateUI()}
canvas.addEventListener('click',toggle);document.getElementById('begin').onclick=toggle;pauseButton.onclick=toggle;soundButton.onclick=()=>{muted=!muted;soundButton.textContent=muted?'Sound off':'Sound on';soundButton.setAttribute('aria-label',muted?'Unmute sound':'Mute sound');if(master)master.gain.setTargetAtTime(muted?0:.7,ac.currentTime,.04)};
seek.oninput=()=>{time=Number(seek.value);lastFrame=-1;lastCue=-1;render(time);updateUI()};window.addEventListener('keydown',e=>{if(e.target===seek)return;if(e.code==='Space'){e.preventDefault();toggle()}if(e.code==='ArrowRight'||e.code==='ArrowLeft'){e.preventDefault();time=clamp(time+(e.code==='ArrowRight'?5:-5),0,total);lastFrame=-1;updateUI()}});
document.addEventListener('visibilitychange',()=>{if(document.hidden&&playing){playing=false;updateUI()}});
if(still){start.style.display='none';document.getElementById('controls').style.display='none'}render(time);updateUI();requestAnimationFrame(tick);
// Inspection API: canonical timeline, editable geometry, exposure sheet, deterministic render.
window.shadowFilm={revision:REVISION,shots,total,FPS,PARTS,ik,render,evidence:()=>rigEvidence,actors:()=>actorEvidence,walkState,seek(t){time=clamp(t,0,total);lastFrame=-1;render(time);updateUI()},state(){return{time,playing,muted,audio:ac?.state}}};
