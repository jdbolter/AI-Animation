<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>VR, Film, and the Uncanny Valley</title>
  <style>
    html, body { margin: 0; height: 100%; background: #000; overflow: hidden; }
    canvas { display: block; cursor: pointer; }
  </style>
</head>
<body>
<canvas id="c"></canvas>
<script>
// VR, Film, and the Far Side of the Uncanny Valley: an animated essay drawn in canvas.
// Characters and effects are drawn "on twos" (12 drawings a second) with boiling ink lines;
// backgrounds are painted once and stay still; the camera moves smoothly through the planes.
// Add ?t=SECONDS to the URL to hold a single frame. Click to pause; it plays once, then click to watch again.

const W = 1280, H = 720;
const cvs = document.getElementById('c');
let ctx = cvs.getContext('2d');
let VIEW = { k: 1, ox: 0, oy: 0 };

const INK = '#2a2420', SKIN = '#e9c9a8';
const HAND = '"Snell Roundhand","Apple Chancery","Segoe Script","Brush Script MT",cursive';
const SERIF = '"Iowan Old Style","Palatino Linotype",Palatino,Georgia,serif';

// ---------- math ----------
const clamp = (v, a = 0, b = 1) => Math.max(a, Math.min(b, v));
const lerp = (a, b, f) => a + (b - a) * f;
const ease = f => { f = clamp(f); return f * f * (3 - 2 * f); };
const easeOut = f => { f = clamp(f); return 1 - (1 - f) ** 3; };
const seg = (u, a, b) => clamp((u - a) / (b - a));
const mid = (a, b) => [(a[0] + b[0]) / 2, (a[1] + b[1]) / 2];
const twos = u => Math.floor(u * 12) / 12;
function mix(a, b, f) { return Array.isArray(a) ? a.map((x, i) => x + (b[i] - x) * f) : a + (b - a) * f; }
// Exposure-sheet keys: [[time, value], ...], eased between neighbours.
function K(u, keys, e = ease) {
  if (u <= keys[0][0]) return keys[0][1];
  for (let i = 1; i < keys.length; i++) {
    if (u < keys[i][0]) {
      const [a, va] = keys[i - 1], [b, vb] = keys[i];
      return mix(va, vb, e((u - a) / (b - a)));
    }
  }
  return keys[keys.length - 1][1];
}
function R(seed) {
  let a = seed >>> 0;
  return () => {
    a = a + 0x6D2B79F5 | 0;
    let t = Math.imul(a ^ a >>> 15, 1 | a);
    t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
    return ((t ^ t >>> 14) >>> 0) / 4294967296;
  };
}
function shade(h, a) {
  const n = parseInt(h.slice(1), 16);
  let r = n >> 16, g = n >> 8 & 255, b = n & 255;
  const t = a < 0 ? 0 : 255, p = Math.abs(a);
  r = Math.round(r + (t - r) * p); g = Math.round(g + (t - g) * p); b = Math.round(b + (t - b) * p);
  return `rgb(${r},${g},${b})`;
}

// ---------- ink ----------
let BOIL = 0;
function jitterPts(pts, amt, r) { return pts.map(p => [p[0] + (r() - .5) * 2 * amt, p[1] + (r() - .5) * 2 * amt]); }
function tracePath(p, close, sharp) {
  ctx.beginPath();
  if (sharp || p.length < 3) {
    ctx.moveTo(p[0][0], p[0][1]);
    for (let i = 1; i < p.length; i++) ctx.lineTo(p[i][0], p[i][1]);
    if (close) ctx.closePath();
    return;
  }
  if (close) {
    const n = p.length; const m = mid(p[n - 1], p[0]);
    ctx.moveTo(m[0], m[1]);
    for (let i = 0; i < n; i++) { const q = p[i], m2 = mid(q, p[(i + 1) % n]); ctx.quadraticCurveTo(q[0], q[1], m2[0], m2[1]); }
    ctx.closePath();
  } else {
    ctx.moveTo(p[0][0], p[0][1]);
    for (let i = 1; i < p.length - 1; i++) { const m = mid(p[i], p[i + 1]); ctx.quadraticCurveTo(p[i][0], p[i][1], m[0], m[1]); }
    const l = p[p.length - 1]; ctx.lineTo(l[0], l[1]);
  }
}
// A hand-inked shape. Fill and line get separate jitter, like paint laid under a drawn line.
// Lines "boil" (redraw slightly differently) unless o.still is set.
function ink(pts, o = {}) {
  const id = o.id || 1, j = o.j ?? 1.1, seed = o.still ? id * 7919 : id * 7919 + BOIL * 104729;
  const close = o.close ?? !!o.fill;
  if (o.fill) { tracePath(jitterPts(pts, j * .8, R(seed + 17)), true, o.sharp); ctx.fillStyle = o.fill; ctx.fill(); }
  if (o.stroke !== false) {
    tracePath(jitterPts(pts, j, R(seed)), close, o.sharp);
    ctx.strokeStyle = o.stroke || INK; ctx.lineWidth = o.w || 2; ctx.lineCap = 'round'; ctx.lineJoin = 'round'; ctx.stroke();
  }
}
function ellPts(c, rx, ry, n = 12) { const p = []; for (let i = 0; i < n; i++) { const a = i / n * Math.PI * 2; p.push([c[0] + Math.cos(a) * rx, c[1] + Math.sin(a) * ry]); } return p; }
function limb(pts, w, col, id) { ink(pts, { w: w + 3.2, stroke: INK, id }); ink(pts, { w, stroke: col, id }); }
function hand(p, skin, s, id) { ink(ellPts(p, 5.5 * s, 5 * s, 8), { fill: skin, w: 1.6, id }); }
function dabs(x, y, w, h, col, n, seed, r0 = 6, r1 = 20, a = .25) {
  const r = R(seed); ctx.save(); ctx.globalAlpha = a; ctx.fillStyle = col;
  for (let i = 0; i < n; i++) {
    const cx = x + r() * w, cy = y + r() * h, rx = lerp(r0, r1, r()), ry = rx * lerp(.3, .7, r());
    ctx.beginPath(); ctx.ellipse(cx, cy, rx, ry, (r() - .5) * .6, 0, Math.PI * 2); ctx.fill();
  }
  ctx.restore();
}
function writeOn(text, x, y, prog) {
  const w = ctx.measureText(text).width;
  if (prog <= 0) return x;
  ctx.save(); ctx.beginPath(); ctx.rect(x - 6, y - 60, w * prog + 6, 90); ctx.clip(); ctx.fillText(text, x, y); ctx.restore();
  return x + w * prog;
}

// ---------- multiplane camera ----------
// p is the plane's depth factor: 1 = character plane, <1 = farther, >1 = nearer the lens.
let CAM = { x: W / 2, y: H / 2, z: 1 };
function layer(p, fn) {
  ctx.save();
  const z = 1 + (CAM.z - 1) * p;
  ctx.translate(W / 2, H / 2); ctx.scale(z, z);
  ctx.translate(-(W / 2 + (CAM.x - W / 2) * p), -(H / 2 + (CAM.y - H / 2) * p));
  fn();
  ctx.restore();
}

// ---------- characters ----------
const MARA = { id: 1, c: '#5c7380', legC: '#4d5f6a', hair: 'bun', hairC: '#3b2a22', seated: true };
const JONAS = { id: 2, c: '#7b5b3e', legC: '#3d3a37', hair: 'short', hairC: '#4a3a2c', glasses: true, seated: true };
const VALE = { id: 3, c: '#3d4658', legC: '#3a3431', hair: 'bun', hairC: '#aaa49b', skin: '#e4c3a6' };
const SON_COAT = '#3d4658', VALE_OWN = '#6d4a56';

function ikE(S, T, a, b, bend) {
  const dx = T[0] - S[0], dy = T[1] - S[1];

  const ang = Math.atan2(dy, dx);
  const A = Math.acos(clamp((a * a + dd * dd - b * b) / (2 * a * dd), -1, 1));
  const e = ang + bend * A;

}
// Build a side-view skeleton. Construction order follows the prompt: line of action (lean),
// pelvis, ribcage, head, then limbs solved toward hand targets.
function rig(o) {

    const knee = [hip[0] + d * 50 * s, hip[1] - (o.kneeUp ?? 12) * s];
    const foot = [knee[0] + d * 6 * s, hip[1] + (o.seatH ?? 48) * s];

  } else {

    for (const k of [0, 1]) {
      const p = ph + k * Math.PI;
      const a1 = Math.sin(p) * .38 * st;
      const bend = Math.max(0, Math.sin(p - 1.3)) * .7 * st;
      const kn = [hip[0] + d * Math.sin(a1) * 50 * s, hip[1] + Math.cos(a1) * 50 * s];
      const a2 = a1 - bend;

    }
  }

  const arm = (T, sign) => {
    if (!T) T = [sh[0] + d * (4 + sign * Math.sin(o.walk || 0) * 14 * (o.stride || 0)) * s, sh[1] + 82 * s];
    const e1 = ikE(sh, T, up, fo, 1), e2 = ikE(sh, T, up, fo, -1);
    const el = e1[1] > e2[1] ? e1 : e2;
    const dx = T[0] - el[0], dy = T[1] - el[1], dl = Math.hypot(dx, dy) || 1;

}
function drawHead(o, r, id) {
  const H = r.Hh, s = r.s, skin = o.skin || SKIN, hc = o.hairC || '#3a2a20';
  if (o.hair === 'bun') ink(ellPts(H(-19, -8), 9 * s, 9 * s, 10), { fill: hc, id: id + 1, w: 1.6 });
  ink([H(-18, -2), H(-17, -15), H(-8, -23), H(6, -23), H(15, -16), H(18, -7), H(19, -2), H(24, 5), H(18, 8), H(18, 13), H(13, 19), H(3, 20), H(-9, 15)], { fill: skin, id: id + 2, w: 2 });
  if (o.hair === 'bun') ink([H(-19, 2), H(-20, -14), H(-10, -24), H(5, -25), H(15, -18), H(8, -16), H(-2, -15), H(-8, -9), H(-12, 3)], { fill: hc, id: id + 3, w: 1.6 });
  if (o.hair === 'short') ink([H(-19, 3), H(-20, -15), H(-9, -25), H(7, -25), H(17, -17), H(11, -17), H(2, -18), H(-6, -12), H(-10, 2)], { fill: hc, id: id + 3, w: 1.6 });
  ink(ellPts(H(-5, 1), 3.5 * s, 5.5 * s, 8), { fill: shade(skin, -.1), id: id + 4, w: 1.3 });
  const e = H(10, -3); ctx.fillStyle = INK; ctx.beginPath(); ctx.arc(e[0], e[1], 1.9 * s, 0, 7); ctx.fill();
  ink([H(6, -9), H(13, -10)], { w: 1.6 * s, id: id + 5 });
  ink([H(14, 13), H(17, 13)], { w: 1.3 * s, id: id + 6 });
  if (o.glasses) { ink(ellPts(H(11, -3), 6 * s, 5 * s, 10), { stroke: '#2a221c', close: true, w: 1.6, id: id + 7 }); ink([H(5, -3), H(-4, -3)], { w: 1.3, id: id + 8 }); }
  if (o.hat === 'cloche') ink([H(-22, -2), H(-21, -17), H(-11, -28), H(7, -28), H(18, -19), H(25, -9), H(12, -11), H(-6, -9), H(-14, -2)], { fill: o.hatC || '#3e3236', id: id + 9, w: 1.8 });
  if (o.hat === 'bowler') { ink(ellPts(H(0, -22), 15 * s, 11 * s, 10), { fill: o.hatC || '#1e1c1b', id: id + 9, w: 1.6 }); ink([H(-21, -14), H(22, -14)], { w: 4 * s, stroke: o.hatC || '#1e1c1b', id: id + 10 }); }
  if (o.hat === 'cap') ink([H(-19, -10), H(-18, -24), H(10, -26), H(18, -14), H(30, -12), H(16, -9), H(-12, -8)], { fill: o.hatC || '#1f2733', id: id + 9, w: 1.6 });
}
function drawArmF(o, r) { const id = o.id * 100 + 60; limb(r.armF, 10.5 * r.s, o.sleeve || o.c, id); hand(r.armF[2], o.skin || SKIN, r.s, id + 1); }
function drawPerson(o, r) {
  const s = r.s, d = r.d, id = o.id * 100 + 7, skin = o.skin || SKIN, legC = o.legC || '#38332f', sl = o.sleeve || o.c;
  const shoe = (p, k) => ink(ellPts([p[0] + d * 6 * s, p[1] - 3 * s], 11 * s, 5 * s, 8), { fill: '#1f1b18', id: id + k, w: 1.5 });
  limb(r.legs[1], 11 * s, shade(legC, -.25), id + 1); shoe(r.legs[1][2], 2);
  limb(r.armB, 10.5 * s, shade(sl, -.22), id + 3); hand(r.armB[2], shade(skin, -.08), s, id + 4);
  limb(r.legs[0], 12 * s, legC, id + 5); shoe(r.legs[0][2], 6);
  limb([r.neck, r.Hh(-3, 16)], 9 * s, skin, id + 8);
  const hf = o.hem ?? 10, hb = hf + (o.hemSkew || 0), L = r.L;
  ink([L(-15, hb), L(-18, -28), L(-16, -70), L(-8, -86), L(6, -88), L(14, -78), L(18, -45), L(19, hf), L(2, hf + 3)], { fill: o.c, id: id + 9, w: 2.2 });
  drawHead(o, r, id + 20);
  if (!o.noArmF) drawArmF(o, r);

// A coat folded over a forearm.
function drape(el, hd, col, id) {
  const x0 = Math.min(el[0], hd[0]) - 6, x1 = Math.max(el[0], hd[0]) + 10, y = (el[1] + hd[1]) / 2;
  ink([[x0, y - 6], [x1, y - 8], [x1 + 4, y + 70], [x1 - 6, y + 112], [x0 + 6, y + 116], [x0 - 4, y + 64]], { fill: col, sharp: true, id, w: 2.2 });
  ink([[x0 + 2, y + 2], [x1 - 2, y], [x1, y + 22], [x0, y + 24]], { fill: shade(col, .12), sharp: true, id: id + 1, w: 1.6 });
  ink([[x0 + 4, y + 30], [x0 - 10, y + 96], [x0 - 2, y + 140], [x0 + 16, y + 138], [x0 + 20, y + 90]], { fill: shade(col, -.15), sharp: true, id: id + 2, w: 2 });
  ink([[x0 - 4, y + 132], [x0 + 18, y + 130]], { w: 2, stroke: 'rgba(200,205,220,.6)', id: id + 3 });
  ink([[(x0 + x1) / 2 + 4, y + 30], [(x0 + x1) / 2 + 2, y + 108]], { w: 1.4, stroke: 'rgba(20,20,30,.6)', id: id + 4 });
}

// ---------- props ----------
function chair(hx, hy, d, floor, id) {
  const c = '#6a4d35', dk = '#4c3624';
  ink([[hx - d * 24, hy + 8], [hx - d * 30, hy - 48]], { w: 5, stroke: dk, still: true, id: id + 3 });
  ink([[hx - d * 27, hy - 44], [hx - d * 34, hy - 40], [hx - d * 31, hy - 20], [hx - d * 24, hy - 24]], { fill: c, still: true, id: id + 4, w: 1.6 });
  ink([[hx - d * 26, hy + 6], [hx + d * 18, hy + 6], [hx + d * 18, hy + 13], [hx - d * 26, hy + 13]], { fill: c, sharp: true, still: true, id, w: 1.8 });
  ink([[hx - d * 22, hy + 13], [hx - d * 22, floor]], { w: 4, stroke: dk, still: true, id: id + 1 });
  ink([[hx + d * 14, hy + 13], [hx + d * 14, floor]], { w: 4, stroke: dk, still: true, id: id + 2 });
}
function desk(cx, floor, d, id) {
  const t = floor - 80;
  ink([[cx + d * 44, t + 30], [cx + d * 42, floor - 4]], { w: 4, stroke: '#4c3624', still: true, id });
  ink([[cx - d * 52, t + 30], [cx - d * 50, floor]], { w: 5, stroke: '#5a412b', still: true, id: id + 1 });
  ink([[cx + d * 52, t + 30], [cx + d * 50, floor]], { w: 5, stroke: '#5a412b', still: true, id: id + 2 });
  ink([[cx - 56, t + 8], [cx + 56, t + 8], [cx + 54, t + 32], [cx - 54, t + 32]], { fill: '#6e5238', sharp: true, still: true, id: id + 3, w: 2 });
  ink([[cx - d * 60, t + 6], [cx + d * 60, t - 4], [cx + d * 60, t + 4], [cx - d * 60, t + 12]], { fill: '#8c6a48', sharp: true, still: true, id: id + 4, w: 2 });
  ink(ellPts([cx + d * 40, t - 8], 6, 7, 8), { fill: '#222', still: true, id: id + 5, w: 1.5 });
  ink([[cx - d * 30, t + 3], [cx + d * 18, t - 2], [cx + d * 20, t + 1], [cx - d * 28, t + 7]], { fill: '#efe4cb', sharp: true, still: true, id: id + 6, w: 1.2 });
}
function seatedAtDesk(P, pose, floor, deskCx) {
  const o = { ...P, ...pose };
  const r = rig(o);
  chair(o.x, o.y, o.dir, floor, o.id * 50 + 500);
  drawPerson({ ...o, noArmF: true }, r);
  desk(deskCx, floor, o.dir, o.id * 50 + 520);
  drawArmF(o, r);

}
function heldPaper(p, ang, id) {
  ctx.save(); ctx.translate(p[0], p[1]); ctx.rotate(ang);
  ink([[-15, -26], [15, -24], [16, 18], [-14, 20]], { fill: '#efe5cd', sharp: true, id, w: 1.5 });
  ctx.restore();
}
function ash(u, n, seed, col) {
  const q = twos(u); ctx.fillStyle = col;
  for (let i = 0; i < n; i++) {
    const r = R(seed + i), sp = 8 + r() * 18;
    const x = r() * W + Math.sin(q * 1.4 + i) * 16;
    const y = ((r() * (H + 80)) + q * sp) % (H + 80) - 40;
    const s = 1.5 + r() * 3;
    ctx.save(); ctx.translate(x, y); ctx.rotate(q * (r() - .5) * 3);

function deskTop(dark) {
  ink([[-300, -300], [W + 300, -300], [W + 300, H + 300], [-300, H + 300]], { fill: dark ? '#3a2a1e' : '#6b4e36', stroke: false, sharp: true, still: true, id: 701 });
  const r = R(702);
  ctx.save(); ctx.strokeStyle = dark ? 'rgba(0,0,0,.25)' : 'rgba(40,25,15,.3)'; ctx.lineWidth = 1.5;
  for (let i = 0; i < 40; i++) {
    const y = -100 + i * 24 + r() * 8;
    ctx.beginPath(); ctx.moveTo(-200, y);

function writingHand(nib, coat, id, lift = 0, noPen = false) {

  limb([X(80, 66), X(160, 180), X(220, 350)], 54, coat, id);
  ink([X(48, 44), X(92, 30), X(104, 62), X(60, 80)], { fill: '#efe9dc', id: id + 4, w: 1.8 });
  if (!noPen && lift > 2) { ctx.fillStyle = 'rgba(0,0,0,.18)'; ctx.beginPath(); ctx.ellipse(nib[0] + 4, nib[1] + 2, 4, 2, 0, 0, 7); ctx.fill(); }
  ink([X(8, 6), X(22, -8), X(48, -6), X(70, 12), X(78, 42), X(58, 62), X(26, 54), X(10, 32)], { fill: SKIN, id: id + 1, w: 2 });
  ink([X(34, 18), X(50, 34)], { w: 1.4, stroke: 'rgba(90,60,40,.6)', id: id + 5 });
  if (!noPen) ink([n, X(42, -74)], { w: 4.5, stroke: '#1f1a17', id: id + 3 });

function polyPart(pts, f) {

function polyPart(pts, f) {

// ---------- the exposure sheet ----------
const SHOTS = [
  { dur: 13, draw: shotColdOpen, caps: [] },
  { dur: 8, draw: shotTitle, caps: [] },
  { dur: 4.5, draw: chapter('I', 'The Uncanny Valley'), caps: [] },
  { dur: 14, draw: shotHeadset, caps: [[.3, 4.4, 'Virtual reality is often promoted as the ultimate medium: one that can reproduce, or even replace, reality.'], [4.6, 8.6, 'Its techniques are those of 3D computer graphics, and its goal is photorealism.'], [8.8, 13.8, 'In that quest, computer graphics artists speak of crossing the “uncanny valley.”']] },
  { dur: 32, draw: shotMori, caps: [[.3, 3, 'The term was coined in 1970 by the roboticist Masahiro Mori.'], [3.2, 8.6, 'He plotted human likeness against what was translated as affinity.'], [8.8, 14.2, 'As robots become more human-like, our affinity for them rises, but only up to a point.'], [14.4, 18.6, 'A close but imperfect resemblance, a prosthetic hand, evokes unease instead. Affinity plummets.'], [18.8, 23.8, 'Only a near-perfect likeness climbs back out. Between lies the valley.'], [24, 31.6, 'Roboticists could avoid it by staying with the not-very-human, or by achieving a perfect resemblance to the human.']] },
  { dur: 16, draw: shotFaces, caps: [[.3, 5.4, 'Computer graphics borrowed the term, because realistic but imperfect 3D humans can become less sympathetic, not more.'], [5.6, 10.4, 'Researchers treat the valley as a problem of perception. CG artists treat it as a practical problem.'], [10.6, 15.8, 'Both imagine the far side of the valley as photography and live-action film.']] },
  { dur: 13, draw: shotRobotScreen, caps: [[.3, 5.6, 'Robots, where Mori’s term began, are physical: they operate in the world, alongside humans.'], [5.8, 12.8, 'Computer graphics lives on screens and in headsets, and so it measures itself against photography and film.']] },
  { dur: 12, draw: shotValley3D, caps: [[.3, 5.6, 'In theory any 3D representation could be uncanny. One could actually have an uncanny 3D valley.'], [5.8, 11.8, 'But the problem is almost always posed for human figures. The challenge of CG is to make a human double.']] },
  { dur: 12, draw: shotNearSide, caps: [[.3, 5.6, 'Many games and digital experiences offer cartoon-like worlds that remain safely on the near side of the valley.'], [5.8, 11.8, 'But the allure of the photorealistic, of the “real,” still drives the development of VR.']] },
  { dur: 16, draw: shotThesis, caps: [[.3, 4.6, 'We look at the uncanny valley in the context of the uncanny double in film.'], [4.8, 10.4, 'Both VR and mainstream film are technologies of illusion, and yet both claim in some sense to reproduce reality.'], [10.6, 15.8, 'The uncanny oscillation between illusion and reality is a key feature of the aesthetics of both.']] },

  { dur: 4.5, draw: chapter('II', 'Film and the Uncanny'), caps: [] },
  { dur: 26, draw: shotBooks, caps: [[.3, 3, 'The human double has a long history in literature and film.'], [3.2, 8.4, 'It may be artificial, made by a “mad scientist,” or another human who bears an uncanny, inexplicable resemblance.'], [8.6, 14.4, 'Poe’s William Wilson. Wilde’s Dorian Gray. Stevenson’s Jekyll and Hyde. Dostoevsky’s The Double. Shelley’s Frankenstein.'], [14.6, 20.2, 'In Hoffmann’s The Sandman, the automaton Olimpia reminds us of Hiroshi Ishiguro’s robot Erica.'], [20.4, 25.8, 'These doubles are imperfect, and the differences are as much a part of the menace as the resemblance.']] },
  { dur: 16, draw: shotFilmstrip, caps: [[.3, 3.4, 'The theme passed easily from literature to film.'], [3.6, 15.8, 'Frankenstein, from 1910. Lubitsch’s The Doll, 1919. Invasion of the Body Snatchers, 1956. Vertigo, 1958. Jordan Peele’s Us, 2019.']] },
  { dur: 26, draw: shotTrain, caps: [[.3, 4.4, 'But part of the explanation lies in film itself, a technology of mechanical reproduction.'], [4.6, 9.6, 'From the first, film was uncanny: it seemed to reproduce the world, even though its audience knew better.'], [9.8, 14.4, 'At the first showing of the Lumières’ train in 1896, the story goes, the audience feared it would crush them.'], [14.6, 20, 'Tom Gunning reads the story as a foundation myth. What it remembers is not naive fear but astonishment.'], [20.2, 25.8, 'The audience knew they were watching a mediated experience, and yet what they saw looked more real than any earlier medium.']] },
  { dur: 13, draw: shotTwoBeliefs, caps: [[.3, 4.4, 'Richard Grusin: the aesthetic of astonishment incorporates two contradictory beliefs —'], [4.6, 12.8, 'the knowledge that one is sitting in a theater watching a new motion picture technology, and the feeling that what one is seeing looks real.']] },
  { dur: 13, draw: shotExpo, caps: [[.3, 6.4, 'Gunning also traced the uncanny pleasure aroused by exhibitions of new technologies at the World Expositions.'], [6.6, 12.8, 'Magic shows drew the same audiences, at the same moment the train arrived at La Ciotat.']] },
  { dur: 21, draw: shotMelies, caps: [[.3, 4.4, 'Georges Méliès owned and performed in a magic theater, the Théâtre Robert-Houdin.'], [4.6, 10, 'On the stage, a vanishing lady needed a trapdoor.'], [10.2, 15.6, 'In his film The Vanishing Lady, 1896, she disappears through a cut.'], [15.8, 20.8, 'Early audiences received film as a new kind of magic, producing the same astonishment as the magic show.']] },
  { dur: 18, draw: shotGorky, caps: [[.3, 4.4, 'For Maxim Gorky, the differences were more disturbing than the resemblance was pleasurable.'], [4.6, 10.4, 'Black-and-white silent film reminded him of everything missing: sound, color, three dimensions.'], [10.6, 17.8, '“It is terrifying to see, but it is the movement of shadows, only of shadows.”']] },
  { dur: 24, draw: shotAsymptote, caps: [[.3, 5.4, 'The gap must exist to arouse astonishment or anxiety, but it cannot be so large that the resemblance is lost.'], [5.6, 10.8, 'Gunning: “this asymptotic approach to the reproduction of life produces the effect of the uncanny.”'], [11, 16.4, 'This is film’s own uncanny valley. An asymptote approaches its target but never reaches it.'], [16.6, 23.8, 'Film added sound and color, faster frame rates, wider screens. But no IMAX audience thinks the action is really happening before their eyes.']] },
  { dur: 18, draw: shotMythEffect, caps: [[.3, 3.8, 'So we can distinguish the La Ciotat myth from the La Ciotat effect.'], [4, 7.8, 'The myth: that film could actually reproduce the real.'], [8, 12.8, 'The effect: the pleasurable or anxious experience of the gap between film and the real.'], [13, 17.8, 'The effect is essential to film, but it could hardly exist without the myth behind it.']] },
  { dur: 13, draw: shotPostCinema, caps: [[.3, 5.2, 'Twenty-first-century film has moved toward “post-cinema,” a cinema of immediate effects and interactions.'], [5.4, 12.8, 'Yet for CG and VR aiming at realism, the far side of the valley looks more like twentieth-century film than post-cinema.']] },
  { dur: 31, draw: shotAura, caps: [[.3, 4.6, 'Walter Benjamin argued that technologies of mechanical reproduction deprive art of its aura.'], [4.8, 8.6, 'Aura is “the unique phenomenon of a distance, however close it may be.”'], [8.8, 12.8, 'Benjamin saw the photographer Atget draining the streets of Paris of aura.'], [13, 17.8, 'Before reproduction, all art had aura, and there was no need to name it. Benjamin could name aura because it was now threatened.'], [18, 23, 'But our media culture seems to want to reinscribe aura. Film made its stars into auratic objects.'], [23.2, 30.8, 'Film exists in a permanent state of losing aura. Neither aura nor its absence is uncanny, but the condition in between.']] },
  { dur: 12, draw: shotSpectrum, caps: [[.3, 5.4, 'Avant-garde films of the 1920s, by Man Ray, Léger and Duchamp, abandoned any pretense to aura.'], [5.6, 11.8, 'We should imagine a spectrum, from films that abandon representation to films fully committed to transparent realism.']] },
  { dur: 28, draw: shotFreud, caps: [[.3, 6.6, 'For Freud, the German unheimlich has an uncanny semantic field of its own. It can come to mean heimlich, its opposite: “homey.”'], [6.8, 12.8, 'The uncanny is the feeling that something is hiding beneath the surface, something both familiar and strange.'], [13, 18.8, 'A fetish, too, is a visual substitute for something else, a feared lack.'], [19, 24.6, 'Filmic doubling substitutes the experience of film for the experience of the world. Film purports to be what we know it is not.'], [24.8, 27.8, 'Photorealistic graphics do the same. Photorealism is often called the “holy grail” of computer graphics.']] },

  { dur: 4.5, draw: chapter('III', 'The Double in Film'), caps: [] },
  { dur: 26, draw: shotPods, caps: [[.3, 5.4, 'In Invasion of the Body Snatchers, 1956, aliens replace humans with doubles grown in pods.'], [5.6, 11.8, 'Examining one, Jack says: “It’s like the first impression that’s stamped on a coin. It isn’t finished.”'], [12, 17.8, 'Miles agrees: “It has all the features but no details, no character, no lines.”'], [18, 25.8, 'The pod sits in the uncanny valley, where CG modeling of humans was perhaps ten years ago.']] },
  { dur: 12, draw: shotGameFaces, caps: [[.3, 6.4, 'Photorealistic game characters now look far more human, but they still lack an authentic sense of character,'], [6.6, 11.8, 'especially in motion: smiling, frowning, talking.']] },
  { dur: 19, draw: shotFamily, caps: [[.3, 6.6, 'In the film, people say their husband, aunt or best friend no longer seems to be the person they knew, though the resemblance is perfect.'], [6.8, 12, 'The loss of authenticity, we could say of aura, carries across all three remakes:'], [12.2, 15.6, '1978, 1993, 2007.'], [15.8, 18.8, 'It is the difference the alien pods cannot erase.']] },
  { dur: 24, draw: shotUs, caps: [[.3, 4.8, 'In Jordan Peele’s Us, replacement is explicit. One double exists for each person.'], [5, 10.8, 'The film realizes the metaphor of the repressed literally: the doubles live underground, mimicking the actions of their twins above.'], [11, 16.8, 'They share their twin’s soul, drained of their own affect, until they break out to take their place.'], [17, 23.8, 'They act out the danger implied in Freud’s analyses of the fetish and the uncanny.']] },
  { dur: 20, draw: shotTodorov, caps: [[.3, 4.6, 'Tzvetan Todorov distinguished the uncanny, which can finally be explained, from the marvelous, which cannot.'], [4.8, 10.4, 'The fantastic is the hesitation between them, and that hesitation fits the experience of filmic doubles.'], [10.6, 15.8, 'Horror resolves it by abandoning rational explanation. Detective films go the other way, uncovering a hidden truth.'], [16, 19.8, 'In that sense, the Freudian psychoanalyst is also a detective.']] },
  { dur: 13, draw: shotVertigo, caps: [[.3, 6.4, 'In Vertigo, the hesitation over the Madeleine and Judy double almost costs the detective his sanity,'], [6.6, 12.8, 'and resolves in a rational, if tragic, conclusion.']] },
  { dur: 30, draw: shotReplace, caps: [[.3, 5, 'Films where doubles supplant humans can be read as allegories: film itself might be superseded by other media.'], [5.2, 7.8, 'Against television in the 1950s, the studios answered with widescreen and vivid color.'], [8, 15.8, 'In the 1990s, video games posed the first digital challenge. Hollywood answered with dystopias of virtual reality.'], [16, 22.8, 'Then it adapted the games themselves, Tomb Raider and Resident Evil, and borrowed their rhythm for its combat: one henchman after another.'], [23, 29.8, 'Blockbusters became hybrids of live action and CG, and the uncanny valley arises precisely in these hybrids.']] },
  { dur: 18, draw: shotAuthentic, caps: [[.3, 5.6, 'If games and VR threaten to blur the line between reality and illusion, film was always liable to the same critique.'], [5.8, 11.6, 'So the industry insists on film’s claim to authenticity: real emotions, authentic human problems.'], [11.8, 17.8, 'Games and VR have not matched that claim. Yet the most popular CG is less post-cinematic than some film itself.']] },

  { dur: 4.5, draw: chapter('IV', 'Uncanny Avatars in Mirror Worlds'), caps: [] },
  { dur: 13, draw: shotAvatar, caps: [[.3, 4, 'The avatar is the uncanny double par excellence in digital media.'], [4.2, 12.8, 'It is your visual persona in a game or a social world, a real-time extension of yourself that you can style to suit your fancy.']] },
  { dur: 27, draw: shotTwoDoubles, caps: [[.3, 3.4, 'There are at least two kinds of doubles in games.'], [3.6, 10.4, 'The non-player characters, often zombies or aliens, stalk and haunt the virtual world, as in The Last of Us and Half-Life: Alyx.'], [10.6, 13.8, 'Even when they are helpful, they are no less uncanny.'], [14, 20, 'The second double is the player’s avatar, which carries some part of the player: movements, intelligence, emotional capacities.'], [20.2, 26.8, 'Sometimes it has a full CG body, sometimes only a point of view and a pair of hands.']] },
  { dur: 24, draw: shotHawaii, caps: [[.3, 7.8, 'On the Morning You Wake (2022) recalls Saturday 13 January 2018, when at 8.07 a.m. everyone in Hawaii received this message.'], [8, 11.6, 'We are not scanned into a system. We are asked to witness.'], [11.8, 17, 'The people and the landscape are rendered eerie and otherworldly. Almost real, but not quite.'], [17.2, 23.8, 'The viewer is sometimes a bodiless set of eyes, sometimes a set of hands, sometimes a whole avatar.']] },
  { dur: 18, draw: shotHome, caps: [[.3, 5.4, 'Many VR systems open in a launch environment called home: a mountaintop cabin, a house in some exotic locale.'], [5.6, 10.6, 'There you take stock of your avatar, often in a mirror, and customize it almost endlessly.'], [10.8, 17.8, 'These avatars are more often cartoonish than photorealistic. But photorealistic capture is progressing rapidly.']] },
  { dur: 28, draw: shotCodec, caps: [[.3, 6, 'In a 2023 podcast, Lex Fridman and Mark Zuckerberg met as photorealistic “codec avatars,” while actually sitting miles apart.'], [6.2, 12, 'They appeared as truncated, floating figures, faces and parts of torsos, without hands, suspended in a black space.'], [12.2, 17.6, 'Fridman: “The realism here is just incredible.” Zuckerberg: “It does feel like you; it doesn’t feel weird.”'], [17.8, 27.8, 'Their performative comments align VR with the most traditional cinematic realism, implying that the hesitation is resolved, the valley crossed.']] },
  { dur: 18, draw: shotScanned, caps: [[.3, 5.8, 'Such avatars are the citizens of the prospective metaverse, imagined as a mirror world of our own.'], [6, 9.4, 'Perhaps the only uncanny statement was an offhand remark:'], [9.6, 17.8, '“We want to get more people scanned and into the system.”']] },
  { dur: 16, draw: shotMirrorWorlds, caps: [[.3, 7, 'Unlike the subterranean mirror world of Us, the metaverse is an endlessly open space that merges with the physical world and expands it.'], [7.2, 15.8, 'Its doubling is not concealed, and certainly not primal. For its enthusiasts, it is simply this moment’s design challenge.']] },
  { dur: 28, draw: shotEmbodied, caps: [[.3, 5, 'VR stages embodiment: the scene is adjusted in real time to every change of orientation and position.'], [5.2, 8.8, 'But embodiment does not raise VR beyond mediation.'], [9, 13.6, 'It opens a new gap: between embodied vision in the headset and the embodiment we feel when we take it off.'], [13.8, 17.8, 'As Ceuterick puts it, VR is always an “oscillation between content, the device and a potentially distracting physical environment.”'], [18, 27.8, 'The uncanny valley of VR is multimodal. Embodiment does not erase the uncanny; it adds another dimension to it.']] },

  { dur: 4.5, draw: chapter('V', 'The Uncanny Is a Feature, Not a Bug'), caps: [] },
  { dur: 24, draw: shotLandscape1900, caps: [[.3, 5.6, 'William Uricchio suggests VR is antithetical to cinema. Yet both share an ambivalent, uncanny claim to capture reality.'], [5.8, 10.6, 'Film entered a landscape of painting, photography and stage entertainment.'], [10.8, 15, 'It recorded the world without the invention of the artist, and it captured the world in motion.'], [15.2, 23.8, 'But it remained an uncanny substitute for the real.']] },
  { dur: 11, draw: shotTrainAgain, caps: [[.3, 10.8, 'The audience could be astonished at how real the train looked only because they knew it was only a moving image.']] },
  { dur: 20, draw: shotSurvival, caps: [[.3, 6.6, 'Film has outlasted television, video games and the VR boom of the 2010s.'], [6.8, 13.8, 'Games, VR and generative AI offer something else: infinite imaginary worlds, not only recordings of this one.'], [14, 19.8, 'And film has borrowed so much from games that it may now be more post-cinematic than VR itself.']] },
  { dur: 15, draw: shotCel, caps: [[.3, 7, 'In principle, computer graphics, like cel animation, is freed of the need to represent the physical world faithfully.'], [7.2, 14.8, 'Yet it keeps photorealism as a key measure, and so inherits film’s anxiety about representing the real.']] },
  { dur: 34, draw: shotFuture, caps: [[.3, 4.2, 'Imagine a time when developers achieve perfect photorealism of human figures.'], [10.2, 15.4, 'Imagine characters visually indistinguishable from humans, holding convincing conversations through generative AI.'], [15.6, 19.8, 'The valley would have been crossed. Yet this world would be more uncanny than ever.'], [20, 26, 'We would still know it was synthetic, different from the world we experience when we take off the headset.'], [26.2, 33.8, 'The only way it could lose the uncanny would be if we were to forget the world outside.']] },
  { dur: 19, draw: shotFinal, caps: [] },
];

// A quiet beat after each shot's last caption, so the images can breathe.
for (const S of SHOTS) if (S.caps.length) S.dur += 3.6;
// Reading time: every caption stays up long enough to read (about 175 words a minute).
// Where the action under a caption is shorter than that, it first plays slower (up to
// STRETCH times), then holds its last pose for whatever time is still needed.
const READ = text => 1.2 + text.split(/\s+/).length / 2.9, STRETCH = 1.5;
for (const S of SHOTS) {
  const knots = [[0, 0]]; let real = 0, story = 0;
  S.realCaps = [];
  for (const [a, b, text] of S.caps) {
    real += a - story; story = a; knots.push([story, real]);
    const ra = real, avail = b - a, need = READ(text), k = Math.min(STRETCH, Math.max(1, need / avail));
    real += avail * k; story = b; knots.push([story, real]);
    if (need > avail * k) { real += need - avail * k; knots.push([story, real]); }
    S.realCaps.push([ra, real, text]);
  }
  real += S.dur - story; knots.push([S.dur, real]);
  S.knots = knots; S.real = real;
}
// Map time on the screen to time in the shot's own action.
function storyTime(S, r) {
  const k = S.knots;
  for (let i = 1; i < k.length; i++) if (r <= k[i][1]) { const [s0, r0] = k[i - 1], [s1, r1] = k[i]; return r1 > r0 ? s0 + (s1 - s0) * (r - r0) / (r1 - r0) : s1; }
  return S.dur;
}
const TOTAL = SHOTS.reduce((a, s) => a + s.real, 0);

function wrap(text, max) {
  const words = text.split(' '), lines = []; let line = '';
  for (const w of words) { const t = line ? line + ' ' + w : w; if (ctx.measureText(t).width > max && line) { lines.push(line); line = w; } else line = t; }
  if (line) lines.push(line);
  return lines;
}
function caption(text, a) {
  ctx.save(); ctx.globalAlpha = a;
  const g = ctx.createLinearGradient(0, H - 200, 0, H); g.addColorStop(0, 'rgba(15,12,10,0)'); g.addColorStop(.5, 'rgba(15,12,10,.5)'); g.addColorStop(1, 'rgba(15,12,10,.75)');
  ctx.fillStyle = g; ctx.fillRect(0, H - 200, W, 200);
  ctx.font = 'italic 27px ' + SERIF; ctx.textAlign = 'center'; ctx.textBaseline = 'alphabetic';
  const lines = wrap(text, 1000); let y = H - 46 - (lines.length - 1) * 36;
  ctx.shadowColor = 'rgba(0,0,0,.8)'; ctx.shadowBlur = 8; ctx.fillStyle = '#f5ecdb';
  for (const l of lines) { ctx.fillText(l, W / 2, y); y += 36; }
  ctx.restore();
}
const GRAIN = [0, 1, 2].map(k => {
  const c = document.createElement('canvas'); c.width = 320; c.height = 180;
  const g = c.getContext('2d'), im = g.createImageData(320, 180), r = R(55 + k);
  for (let i = 0; i < im.data.length; i += 4) { const v = 205 + r() * 50; im.data[i] = v; im.data[i + 1] = v * .985; im.data[i + 2] = v * .95; im.data[i + 3] = 255; }
  g.putImageData(im, 0, 0); return c;
});

function render(t) {
  BOIL = Math.floor(t * 8);
  let acc = 0, i = 0;
  while (i < SHOTS.length - 1 && t >= acc + SHOTS[i].real) { acc += SHOTS[i].real; i++; }
  const S = SHOTS[i], r = t - acc, u = storyTime(S, r);
  ctx.setTransform(1, 0, 0, 1, 0, 0); ctx.globalAlpha = 1; ctx.globalCompositeOperation = 'source-over';
  ctx.fillStyle = '#000'; ctx.fillRect(0, 0, cvs.width, cvs.height);
  ctx.setTransform(VIEW.k, 0, 0, VIEW.k, VIEW.ox, VIEW.oy);
  ctx.save(); ctx.beginPath(); ctx.rect(0, 0, W, H); ctx.clip();
  ctx.save(); S.draw(u); ctx.restore();
  ctx.save(); ctx.globalCompositeOperation = 'multiply'; ctx.globalAlpha = .45; ctx.drawImage(GRAIN[BOIL % 3], 0, 0, W, H); ctx.restore();
  const v = ctx.createRadialGradient(W / 2, H / 2, H * .45, W / 2, H / 2, H * 1.05);
  v.addColorStop(0, 'rgba(0,0,0,0)'); v.addColorStop(1, 'rgba(10,6,3,.45)'); ctx.fillStyle = v; ctx.fillRect(0, 0, W, H);
  const fade = Math.max(0, 1 - r / .5, 1 - (S.real - r) / .5);
  if (fade > 0) { ctx.fillStyle = `rgba(18,15,12,${fade})`; ctx.fillRect(0, 0, W, H); }
  for (const [a, b, text] of S.realCaps) {
    if (r > a && r < b) caption(text, Math.min(1, (r - a) / .35, (b - r) / .35));
  }
  ctx.restore();
}

function resize() {
  const dpr = Math.min(window.devicePixelRatio || 1, 2), cw = innerWidth, ch = innerHeight;
  cvs.width = Math.round(cw * dpr); cvs.height = Math.round(ch * dpr);
  cvs.style.width = cw + 'px'; cvs.style.height = ch + 'px';
  const k = Math.min(cw / W, ch / H) * dpr;
  VIEW = { k, ox: (cvs.width - W * k) / 2, oy: (cvs.height - H * k) / 2 };
}
const FIX = new URLSearchParams(location.search).get('t');
if (new URLSearchParams(location.search).has('debug')) { let a = 0; console.log('TOTAL ' + TOTAL.toFixed(1) + ' starts ' + SHOTS.map(S => { const x = a; a += S.real; return x.toFixed(1); }).join(',')); }
let clock = 0, last = null, paused = false;
let ended = false;
function frame(now) {
  if (last !== null && !paused && !ended) clock += Math.min(.1, (now - last) / 1000);
  last = now;
  if (clock >= TOTAL - .001) { clock = TOTAL - .001; ended = true; }
  render(clock);
  if (ended) endCard();
  requestAnimationFrame(frame);
}
// The film plays once and stops on its last (faded) frame with an offer to watch again.
function endCard() {
  ctx.setTransform(VIEW.k, 0, 0, VIEW.k, VIEW.ox, VIEW.oy);
  ctx.save(); ctx.font = 'italic 34px ' + SERIF; ctx.textAlign = 'center'; ctx.fillStyle = '#f5ecdb';
  ctx.fillText('\u21bb  Watch again', W / 2, H / 2 + 12); ctx.restore();
}
function toggle() { if (ended) { clock = 0; ended = false; paused = false; } else paused = !paused; }
addEventListener('resize', () => { resize(); if (FIX !== null) render(parseFloat(FIX)); });
addEventListener('click', toggle);
addEventListener('keydown', e => { if (e.key === ' ') { toggle(); e.preventDefault(); } });
resize();
// A held frame is redrawn for its first second, in case the page is still being sized.
let held = 0;
function hold() { resize(); render(parseFloat(FIX)); if (++held < 60) requestAnimationFrame(hold); }
if (FIX !== null) hold(); else requestAnimationFrame(frame);
</script>
