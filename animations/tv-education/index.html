<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Room 4</title>
  <style>
    html, body { margin: 0; height: 100%; background: #000; overflow: hidden; }
    canvas { display: block; cursor: pointer; }
  </style>
</head>
<body>
<canvas id="c"></canvas>
<script>
// Room 4: an alternate history of the American grade-school classroom, 1962–2026, in which
// television replaced the textbook. Five vignettes; drawn in canvas as a multiplane cartoon.
// Characters are drawn "on twos" with boiling ink lines; backgrounds are painted once and stay still.
// Add ?t=SECONDS to the URL to hold a single frame. Click to pause; it plays once, then click to watch again.

const W = 1280, H = 720;
const cvs = document.getElementById('c');
let ctx = cvs.getContext('2d');
let VIEW = { k: 1, ox: 0, oy: 0 };

const INK = '#2a2420';
const SERIF = '"Iowan Old Style","Palatino Linotype",Palatino,Georgia,serif';
const HAND = '"Bradley Hand","Segoe Print","Comic Sans MS",cursive';
const CHALK = 'Chalkduster,"Chalkboard SE","Comic Sans MS",cursive';
const SANS = '"Helvetica Neue",Helvetica,Arial,sans-serif';
const MONO = '"Courier New",Courier,monospace';

// ---------- math ----------
const clamp = (v, a = 0, b = 1) => Math.max(a, Math.min(b, v));
const lerp = (a, b, f) => a + (b - a) * f;
const ease = f => { f = clamp(f); return f * f * (3 - 2 * f); };
const easeOut = f => { f = clamp(f); return 1 - (1 - f) ** 3; };
const easeIn = f => { f = clamp(f); return f * f * f; };
const seg = (u, a, b) => clamp((u - a) / (b - a));
const mid = (a, b) => [(a[0] + b[0]) / 2, (a[1] + b[1]) / 2];
const twos = u => Math.floor(u * 12) / 12;
const frac = x => x - Math.floor(x);
const within = (u, a, b) => u > a && u < b;
function mix(a, b, f) { return Array.isArray(a) ? a.map((x, i) => mix(x, b[i], f)) : a + (b - a) * f; }
// Exposure-sheet keys: [[time, value], ...], eased between neighbours.
function K(u, keys, e = ease) {
  if (u <= keys[0][0]) return keys[0][1];
  for (let i = 1; i < keys.length; i++) {
    if (u < keys[i][0]) {
      const [a, va] = keys[i - 1], [b, vb] = keys[i];
      return mix(va, vb, e((u - a) / (b - a)));
    }
  }
  return keys[keys.length - 1][1];
}
function R(seed) {
  let a = seed >>> 0;
  return () => {
    a = a + 0x6D2B79F5 | 0;
    let t = Math.imul(a ^ a >>> 15, 1 | a);
    t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
    return ((t ^ t >>> 14) >>> 0) / 4294967296;
  };
}
function rgb(h) { const n = parseInt(h.slice(1), 16); return [n >> 16, n >> 8 & 255, n & 255]; }
function shade(h, a) {
  let [r, g, b] = rgb(h);
  const t = a < 0 ? 0 : 255, p = Math.abs(a);
  r = Math.round(r + (t - r) * p); g = Math.round(g + (t - g) * p); b = Math.round(b + (t - b) * p);
  return '#' + [r, g, b].map(v => v.toString(16).padStart(2, '0')).join('');
}
function mixC(a, b, f) { const x = rgb(a), y = rgb(b); return '#' + x.map((v, i) => Math.round(v + (y[i] - v) * clamp(f)).toString(16).padStart(2, '0')).join(''); }

// ---------- ink ----------
let BOIL = 0;
function jitterPts(pts, amt, r) { return pts.map(p => [p[0] + (r() - .5) * 2 * amt, p[1] + (r() - .5) * 2 * amt]); }
function tracePath(p, close, sharp) {
  ctx.beginPath();
  if (sharp || p.length < 3) {
    ctx.moveTo(p[0][0], p[0][1]);
    for (let i = 1; i < p.length; i++) ctx.lineTo(p[i][0], p[i][1]);
    if (close) ctx.closePath();
    return;
  }
  if (close) {
    const n = p.length; const m = mid(p[n - 1], p[0]);
    ctx.moveTo(m[0], m[1]);
    for (let i = 0; i < n; i++) { const q = p[i], m2 = mid(q, p[(i + 1) % n]); ctx.quadraticCurveTo(q[0], q[1], m2[0], m2[1]); }
    ctx.closePath();
  } else {
    ctx.moveTo(p[0][0], p[0][1]);
    for (let i = 1; i < p.length - 1; i++) { const m = mid(p[i], p[i + 1]); ctx.quadraticCurveTo(p[i][0], p[i][1], m[0], m[1]); }
    const l = p[p.length - 1]; ctx.lineTo(l[0], l[1]);
  }
}
// A hand-inked shape. Fill and line get separate jitter, like paint laid under a drawn line.
// Lines "boil" (redraw slightly differently) unless o.still is set.
function ink(pts, o = {}) {
  const id = o.id || 1, j = o.j ?? 1.1, seed = o.still ? id * 7919 : id * 7919 + BOIL * 104729;
  const close = o.close ?? !!o.fill;
  if (o.fill) { tracePath(jitterPts(pts, j * .8, R(seed + 17)), true, o.sharp); ctx.fillStyle = o.fill; ctx.fill(); }
  if (o.stroke !== false) {
    tracePath(jitterPts(pts, j, R(seed)), close, o.sharp);
    ctx.strokeStyle = o.stroke || INK; ctx.lineWidth = o.w || 2; ctx.lineCap = 'round'; ctx.lineJoin = 'round'; ctx.stroke();
  }
}
function ellPts(c, rx, ry, n = 12) { const p = []; for (let i = 0; i < n; i++) { const a = i / n * Math.PI * 2; p.push([c[0] + Math.cos(a) * rx, c[1] + Math.sin(a) * ry]); } return p; }
function box(x, y, w, h, o = {}) { ink([[x, y], [x + w, y], [x + w, y + h], [x, y + h]], { sharp: true, still: true, j: .6, ...o }); }
function limb(pts, w, col, id) { ink(pts, { w: w + 3, stroke: INK, id }); ink(pts, { w, stroke: col, id }); }
function dabs(x, y, w, h, col, n, seed, r0 = 6, r1 = 20, a = .25) {
  const r = R(seed); ctx.save(); ctx.globalAlpha = a; ctx.fillStyle = col;
  for (let i = 0; i < n; i++) {
    const cx = x + r() * w, cy = y + r() * h, rx = lerp(r0, r1, r()), ry = rx * lerp(.3, .7, r());
    ctx.beginPath(); ctx.ellipse(cx, cy, rx, ry, (r() - .5) * .6, 0, Math.PI * 2); ctx.fill();
  }
  ctx.restore();
}
function strand(c, w0, w1) {
  const L = [], Rr = [];
  for (let i = 0; i < c.length; i++) {
    const a = c[Math.max(0, i - 1)], b = c[Math.min(c.length - 1, i + 1)];
    let nx = -(b[1] - a[1]), ny = b[0] - a[0]; const l = Math.hypot(nx, ny) || 1; nx /= l; ny /= l;
    const w = lerp(w0, w1, i / (c.length - 1)) / 2;
    L.push([c[i][0] + nx * w, c[i][1] + ny * w]); Rr.push([c[i][0] - nx * w, c[i][1] - ny * w]);
  }
  return L.concat(Rr.reverse());
}
// Two-bone reach: elbow (or knee) and the end point; pick scores the two possible joints.
function ik(S, T, a, b, pick) {
  const dx = T[0] - S[0], dy = T[1] - S[1];
  const dd = clamp(Math.hypot(dx, dy), Math.abs(a - b) + 1, a + b - .5);
  const ang = Math.atan2(dy, dx);
  const A = Math.acos(clamp((a * a + dd * dd - b * b) / (2 * a * dd), -1, 1));
  const e1 = [S[0] + Math.cos(ang + A) * a, S[1] + Math.sin(ang + A) * a];
  const e2 = [S[0] + Math.cos(ang - A) * a, S[1] + Math.sin(ang - A) * a];
  const E = pick(e1) >= pick(e2) ? e1 : e2;
  const ha = Math.atan2(T[1] - E[1], T[0] - E[0]);
  return [E, [E[0] + Math.cos(ha) * b, E[1] + Math.sin(ha) * b]];
}
function text(t, x, y, font, col, align = 'center', a = 1) {
  ctx.save(); ctx.globalAlpha *= a; ctx.font = font; ctx.fillStyle = col; ctx.textAlign = align; ctx.textBaseline = 'alphabetic'; ctx.fillText(t, x, y); ctx.restore();
}
// Writing that appears as if by hand, left to right.
function written(t, x, y, font, col, f, align = 'left') {
  if (f <= 0) return;
  ctx.save(); ctx.font = font; const w = ctx.measureText(t).width; const x0 = align === 'center' ? x - w / 2 : x;
  ctx.beginPath(); ctx.rect(x0 - 4, y - 200, (w + 8) * clamp(f), 300); ctx.clip();
  ctx.fillStyle = col; ctx.textAlign = 'left'; ctx.fillText(t, x0, y); ctx.restore();
}

// ---------- multiplane camera ----------
// p is the plane's depth factor: 1 = character plane, <1 = farther, >1 = nearer the lens.
let CAM = { x: W / 2, y: H / 2, z: 1 };
function layer(p, fn) {
  ctx.save();
  const z = 1 + (CAM.z - 1) * p;
  ctx.translate(W / 2, H / 2); ctx.scale(z, z);
  ctx.translate(-(W / 2 + (CAM.x - W / 2) * p), -(H / 2 + (CAM.y - H / 2) * p));
  fn();
  ctx.restore();
}

// ---------- people ----------
// Body plans, in pixels at s = 1. Children have big heads and short limbs.
const KID = { r: 22, neck: 5, torso: 50, ua: 27, fa: 25, th: 33, sh: 31, chest: 15, back: 12, arm: 8, leg: 10, foot: 11, eye: 1.15 };
const ADULT = { r: 20, neck: 9, torso: 74, ua: 39, fa: 37, th: 50, sh: 48, chest: 18, back: 15, arm: 9, leg: 12, foot: 14, eye: 1 };

// Hair: a cap over the skull, given as angles (front hairline round over the top to the nape)
// and an inner hairline, for the profile (p) and the front (f); the head's turn mixes the two.
const CAPS = {
  base: { p: [-32, -212, [[-.55, .3], [-.3, -.05], [.12, -.55], [.5, -.62]]], f: [-8, -172, [[-.88, -.2], [-.4, -.62], [.4, -.62], [.88, -.2]]] },
  crew: { p: [-48, -198, [[-.5, .15], [-.3, -.3], [.1, -.7], [.42, -.78]]], f: [-28, -152, [[-.8, -.45], [-.35, -.78], [.35, -.78], [.8, -.45]]] },
  bowl: { p: [-12, -214, [[-.6, .32], [-.35, 0], [.3, -.32], [.78, -.3]]], f: [6, -186, [[-.95, -.05], [-.5, -.36], [.5, -.36], [.95, -.05]]] },
};
const STYLES = {
  crew: { cap: 'crew' }, base: { cap: 'base' }, bowl: { cap: 'bowl' },
  bob: { cap: 'base', side: [-.5, .3, .9, .5, .62] },
  long: { cap: 'base', side: [-.62, .8, .95, .5, 1.05] },
  pony: { cap: 'base', tail: true },
  puffs: { cap: 'base', puffs: true },
  beehive: { cap: 'base', dome: true, side: [-.5, .25, .95, .42, .5] },
  bun: { cap: 'base', bun: true },
  shag: { cap: 'bowl', side: [-.55, .45, .95, .5, .7] },
};

// The head. C is its centre, ang its rotation; turn 0 is profile, 1 faces the camera.
function head(C, r, ang, d, o, id) {
  const t = o.turn || 0, st = STYLES[o.style || 'base'], cap = CAPS[st.cap];
  const ca = Math.cos(ang), sa = Math.sin(ang);
  const hp = (hx, hy) => { const x = d * hx * r, y = hy * r; return [C[0] + x * ca - y * sa, C[1] + x * sa + y * ca]; };
  const hair = o.hair, hairD = shade(hair, -.25);
  // hair behind the head
  if (st.side) {
    const [px, py, fx, rx, ry] = st.side;
    for (const sg of [-1, 1]) ink(ellPts([0, 0], 1, 1, 12).map(([a, b]) => hp(lerp(px, sg * fx, t) + a * rx, py + b * ry)), { fill: hairD, w: 1.6, id: id + 40 + sg });
  }
  if (st.tail) {
    const sw = Math.sin((o.t || 0) * 3) * .08;
    const a0 = [lerp(-.82, 0, t), lerp(-.4, -.6, t)];
    ink(strand([hp(...a0), hp(a0[0] - .45 + sw, a0[1] + .35), hp(a0[0] - .5 + sw * 2, a0[1] + .95)], .42 * r, .18 * r), { fill: hair, w: 1.6, id: id + 43 });
  }
  // skull
  ink(ellPts([0, 0], 1, 1.04, 16).map(([a, b]) => hp(a, b)), { fill: o.skin, w: 2.1, id: id + 1 });
  // the cap of hair
  const A = lerp(cap.p[0], cap.f[0], t) * Math.PI / 180, B = lerp(cap.p[1], cap.f[1], t) * Math.PI / 180;
  const pts = [];
  for (let i = 0; i <= 14; i++) { const a = lerp(A, B, i / 14); pts.push(hp(Math.cos(a) * 1.08, Math.sin(a) * 1.08)); }
  for (let i = 0; i < 4; i++) pts.push(hp(lerp(cap.p[2][i][0], cap.f[2][i][0], t), lerp(cap.p[2][i][1], cap.f[2][i][1], t)));
  ink(pts, { fill: hair, w: 1.8, id: id + 2 });
  if (st.dome) ink(ellPts([0, 0], 1, 1, 14).map(([a, b]) => hp(lerp(-.15, 0, t) + a * .98, -1 + b * .62)), { fill: hair, w: 1.8, id: id + 3 });
  if (st.bun) ink(ellPts([0, 0], 1, 1, 10).map(([a, b]) => hp(lerp(-.95, 0, t) + a * .36, lerp(-.45, -1.05, t) + b * .36)), { fill: hair, w: 1.6, id: id + 4 });
  if (st.puffs) for (const [p, f] of [[[-.05, -1.05], [.8, -.8]], [[-.45, -.95], [-.8, -.8]]]) ink(ellPts([0, 0], 1, 1, 10).map(([a, b]) => hp(lerp(p[0], f[0], t) + a * .44, lerp(p[1], f[1], t) + b * .44)), { fill: hair, w: 1.6, id: id + 5 + p[0] * 10 });
  // ears
  const ear = x => ink(ellPts([0, 0], 1, 1, 8).map(([a, b]) => hp(x + a * .15, .1 + b * .2)), { fill: o.skin, w: 1.5, id: id + 6 + x * 10 });
  ear(lerp(-.1, -.97, t));
  if (t > .55) ear(.97);
  // face
  const fx = lerp(.42, 0, t), lk = o.look || [0, 0], E = (o.b || KID).eye;
  if (t < .5) ink([hp(lerp(.86, .4, t * 2), -.08), hp(lerp(1.14, .62, t * 2), .2), hp(lerp(.9, .42, t * 2), .3)], { fill: o.skin, w: 1.6, id: id + 7 });
  else ink([hp(fx + .02, .08), hp(fx + .08, .24), hp(fx - .02, .27)], { w: 1.4, id: id + 7 });
  if (o.freckles) { ctx.fillStyle = 'rgba(170,90,50,.55)'; for (const [a, b] of [[.12, .22], [.2, .3], [.05, .32], [-.1, .26]]) { const p = hp(fx + a + .12 * (1 - t), b); ctx.beginPath(); ctx.arc(p[0], p[1], .045 * r, 0, 7); ctx.fill(); } }
  const eyes = [fx + lerp(.13, .36, t)]; if (t > .22) eyes.push(fx - lerp(-.1, .36, t));
  for (const ex of eyes) {
    const p = hp(ex + lk[0] * .05, -.04 + lk[1] * .06);
    if (o.blink) ink([hp(ex - .1, -.03), hp(ex + .1, -.02)], { w: 1.8, id: id + 8 });
    else {
      const big = 1 + (o.wide || 0) * .35;
      ctx.fillStyle = '#1e1612'; ctx.beginPath(); ctx.ellipse(p[0], p[1], .095 * r * E * big, .14 * r * E * big, ang, 0, 7); ctx.fill();
      ctx.fillStyle = '#fff'; ctx.beginPath(); ctx.arc(p[0] + .03 * r, p[1] - .05 * r, .035 * r, 0, 7); ctx.fill();
    }
    const bw = o.brow || 0;
    ink([hp(ex - .13, -.27 - bw * .08), hp(ex + .12 * d * d, -.3 + bw * .06)], { w: 1.6, stroke: hairD, id: id + 9 });
  }
  if (o.glasses) {
    for (const ex of eyes) ink(ellPts([0, 0], 1, 1, 10).map(([a, b]) => hp(ex + a * .2, -.03 + b * .16)), { w: 1.6, stroke: '#4a3a30', id: id + 10 });
    ink([hp(eyes[0] - .2, -.06), hp(lerp(-.05, -.97, t), -.04)], { w: 1.4, stroke: '#4a3a30', id: id + 11 });
  }
  // mouth
  let m = o.mouth || 'smile';
  if (m === 'talk') m = Math.floor((o.t || 0) * 7) % 2 ? 'o' : 'flat';
  const mx = fx + lerp(.3, 0, t), mw = lerp(.11, .2, t), my = .5;
  if (m === 'smile') ink([hp(mx - mw, my - .06), hp(mx, my + .06), hp(mx + mw * .8, my - .07)], { w: 1.7, id: id + 12 });
  else if (m === 'frown') ink([hp(mx - mw, my + .06), hp(mx, my - .03), hp(mx + mw * .8, my + .06)], { w: 1.7, id: id + 12 });
  else if (m === 'flat') ink([hp(mx - mw * .8, my), hp(mx + mw * .7, my)], { w: 1.7, id: id + 12 });
  else if (m === 'o') ink(ellPts([0, 0], 1, 1, 8).map(([a, b]) => hp(mx + a * .07, my + .02 + b * .09)), { fill: '#6a2a24', w: 1.4, id: id + 12 });
  else if (m === 'grin') ink([hp(mx - mw * 1.2, my - .08), hp(mx + mw, my - .1), hp(mx + mw * .7, my + .06), hp(mx, my + .14), hp(mx - mw, my + .04)], { fill: '#7a2e26', w: 1.5, id: id + 12 });
  if (o.phones) {
    const ea = hp(lerp(-.1, -.97, t), .1), eb = hp(lerp(-.1, .97, t), .1), top = hp(lerp(-.1, 0, t), -1.18);
    ink([ea, top, eb], { w: 3, stroke: '#3a3a40', id: id + 13 });
    ink(ellPts(ea, .26 * r, .3 * r, 10), { fill: '#4a4a52', w: 1.4, id: id + 14 });
    if (t > .55) ink(ellPts(eb, .2 * r, .3 * r, 10), { fill: '#4a4a52', w: 1.4, id: id + 15 });
  }
  return hp;
}

// A person in profile (d = 1 faces right). x, y is the hip. Hands are given relative to the
// shoulder and feet relative to the hip, in local units (mirrored by d), unless handsAbs / feetAbs.
function person(o) {
  const b = o.b || KID, s = o.s || 1, d = o.d || 1, id = o.id || 100;
  const lean = o.lean || 0, tilt = o.tilt || 0;
  const Hx = o.x, Hy = o.y;
  const U = [d * Math.sin(lean), -Math.cos(lean)], F = [d * Math.cos(lean), Math.sin(lean)];
  const P = (v, h) => [Hx + (F[0] * v + U[0] * h) * s, Hy + (F[1] * v + U[1] * h) * s];
  const S = P(-b.back * .1, b.torso * .88), S2 = P(-b.back * .3, b.torso * .86);
  const loc = (O, q) => [O[0] + d * q[0] * s, O[1] + q[1] * s];
  const hands = [0, 1].map(i => (o.handsAbs && o.handsAbs[i]) || loc(i ? S2 : S, (o.hands && o.hands[i]) || [i ? -3 : 3, b.ua + b.fa - 3]));
  const feet = [0, 1].map(i => (o.feetAbs && o.feetAbs[i]) || loc([Hx, Hy], (o.feet && o.feet[i]) || [i ? -4 : 4, b.th + b.sh - 1]));
  const armPick = (o.elbowOut ? e => d * e[0] : e => e[1] - d * e[0] * .3);
  const legPick = e => d * e[0] - e[1] * .05;
  const skinD = shade(o.skin, -.12), sleeveL = o.sleeve === 'long';
  function arm(i) {
    const Sh = i ? S2 : S, [E, Hn] = ik(Sh, hands[i], b.ua * s, b.fa * s, armPick);
    const c = i ? shade(o.shirt, -.15) : o.shirt;
    limb([Sh, E], b.arm * s, c, id + 20 + i);
    limb([E, Hn], (b.arm - 1.5) * s, sleeveL ? c : (i ? skinD : o.skin), id + 22 + i);
    if (sleeveL) ink(ellPts(Hn, 4.2 * s, 4.2 * s, 7), { fill: i ? skinD : o.skin, w: 1.4, id: id + 24 + i });
    else ink(ellPts(Hn, 4.2 * s, 4.2 * s, 7), { fill: i ? skinD : o.skin, w: 1.4, id: id + 24 + i });
    return Hn;
  }
  function leg(i) {
    const [Kn, Ft] = ik([Hx, Hy], feet[i], b.th * s, b.sh * s, legPick);
    const pc = o.pants ? (i ? shade(o.pants, -.15) : o.pants) : (i ? shade(o.legs || o.skin, -.12) : (o.legs || o.skin));
    const sc = o.shorts || o.skirt ? (i ? shade(o.legs || o.skin, -.12) : (o.legs || o.skin)) : pc;
    limb([[Hx, Hy], Kn], b.leg * s, pc, id + 30 + i);
    limb([Kn, Ft], (b.leg - 1.5) * s, sc, id + 32 + i);
    const tip = o.tiptoe ? -.5 : 0;
    ink([[Ft[0] - d * 4 * s, Ft[1] - 4 * s], [Ft[0] + d * b.foot * s, Ft[1] - 1 * s + tip * 6 * s], [Ft[0] + d * b.foot * s, Ft[1] + 3 * s], [Ft[0] - d * 5 * s, Ft[1] + 3 * s]], { fill: i ? shade(o.shoes, -.2) : o.shoes, w: 1.5, id: id + 34 + i });
    return Kn;
  }
  const out = { S, hands, P };
  out.far = arm(1);
  const k2 = leg(1);
  // pelvis
  ink(ellPts(P(b.chest * .1 - b.back * .2, 4), (b.chest + b.back) * .5 * s, 9 * s, 10), { fill: o.skirt || o.pants || o.shirt, w: 1.8, id: id + 3 });
  // torso
  const tp = [[-b.back * .8, -2], [b.chest * .75, -2], [b.chest * .9, b.torso * .35], [b.chest, b.torso * .68], [b.chest * .55, b.torso * .97], [-b.back * .45, b.torso * 1.0], [-b.back, b.torso * .7], [-b.back * .9, b.torso * .3]];
  ink(tp.map(q => P(...q)), { fill: o.shirt, w: 2.1, id: id + 4 });

      mouth: within(u, 1, 4.6) ? 'talk' : u > 9.4 ? 'smile' : 'flat', t: u, blink: within(u, 6, 6.15) || within(u, 12, 12.15), id: 2790,
      prop: o => { const c = mid(o.hands[0], o.hands[1]); ctx.save(); ctx.translate(c[0], c[1] - 6); ctx.rotate(.1); box(-40, -8, 80, 14, { fill: '#f2ead6', id: 2990 }); box(-42, 4, 84, 6, { fill: '#2f5a3e', id: 2991 }); if (page > 0 && page < 1) ink([[0, -8], [Math.cos(page * Math.PI) * 40, -8 - Math.sin(page * Math.PI) * 30]], { w: 3, stroke: '#e8dcc0', id: 2992 }); ctx.restore(); } });
    // Ms. Reyes kneels beside her

}

function shotCoda(u) {

    box(...P(-270, -132), 540 * .9, 14 * .9, { fill: '#c8c0b0', id: 3042 });
    for (let i = 0; i < 8; i++) { if (i === 4) continue; box(...P(-236 + i * 60, -96), 40 * .9, 52 * .9, { fill: i === 6 ? '#ffd890' : '#4a5a6a', w: 1.5, id: 3043 + i }); }

  layer(1.4, () => { ctx.fillStyle = 'rgba(30,25,20,.5)'; for (let i = 0; i < 9; i++) { const x = -200 + i * 190; ctx.fillRect(x, 640, 6, 120); } ctx.fillRect(-300, 660, W + 600, 5); });
  const a = ease(seg(u, 8.6, 10.4));
  if (a > 0) { ctx.save(); ctx.globalAlpha = a; ctx.shadowColor = 'rgba(0,0,0,.7)'; ctx.shadowBlur = 14; text('Room 4', W / 2, 200, `76px ${SERIF}`, '#fbf4e2'); text('1962 – 2026', W / 2, 246, `italic 28px ${SERIF}`, '#efe2c8'); ctx.restore(); }
}

// ---------- the exposure sheet ----------
const SHOTS = [
  { dur: 8, draw: shotTitle, caps: [] },
  { dur: 14, draw: shotPlane, caps: [[1, 6.4, 'In 1961 an airplane began circling over Indiana, broadcasting lessons to the schools below.'], [7, 12.4, 'In this history the experiment never ended, and television replaced the textbook wherever it could.']] },
  { dur: 13.5, draw: shotPacking, caps: [[.8, 6, 'At Maple Street School, Miss Halloran packed the arithmetic books into a box for the closet.'], [7.4, 12.6, 'In their place came a television on a tall cart.']] },
  { dur: 14.5, draw: shotWatch, caps: [[.8, 5.6, 'The teacher on the screen could not see the class.'], [7.6, 12.6, 'His lesson went on at the same speed for everyone.']] },
  { dur: 16.5, draw: shotKneel, caps: [[.6, 5.6, 'So Miss Halloran stopped teaching from the front of the room, and went to whoever was lost.'], [7, 11.6, 'Seven rows of nine. Danny counted them himself.'], [12.4, 14.8, 'Her job had become a tutor’s.']] },
  { dur: 12, draw: shotStreet, caps: [[1.6, 8, 'By 1975 the lessons came home too. Channel 7 replayed the school day every afternoon at four.']] },
  { dur: 20, draw: shotHomework, caps: [[.8, 6.6, 'Homework was watching. Linda’s notebook had no questions in it, only her answers.'], [9, 13.6, 'Her little brother had other plans for the television.']] },
  { dur: 15, draw: shotSnack, caps: [[.6, 3.6, 'Then her mother came in with a snack.'], [8.8, 13.2, 'Television did not wait. The answer would come round again next Tuesday.']] },
  { dur: 15, draw: shotScreens88, caps: [[1.6, 6.8, 'By 1988 Room 4 had a screen for every child, and a shelf of videotapes.'], [7.6, 13.4, 'Mrs. Halloran was still there. She had not stood at the front of the room in twenty-six years.']] },
  { dur: 13, draw: shotRewind, caps: [[.4, 4, 'A tape could be stopped and rewound, as often as it took.'], [7.4, 11.6, 'So no two children were on the same lesson any more.']] },
  { dur: 14.5, draw: shotSpelling, caps: [[.4, 6.4, 'Some raced a year ahead. Some were stuck on one tape for a week.'], [7.6, 13.8, 'They could explain photosynthesis, with diagrams. Fewer of them could spell it.']] },
  { dur: 20.5, draw: shotPause, caps: [[1.8, 7.4, 'Linda grew up and had a son, Max. He did his homework on a computer.'], [8.6, 12.6, 'When she brought him a snack, he pressed pause.'], [14.4, 18.6, 'The lesson waited for him. Linda found she was a little jealous.']] },

  { dur: 16.5, draw: shotWaits, caps: [[.6, 4.6, '“How do you make it play?” June asked.'], [5.4, 9.6, '“It doesn’t play,” said Ms. Reyes. “It waits for you.”']] },
  { dur: 18, draw: shotCoda, caps: [[1.2, 7.4, 'After that, the box stayed out of the closet, and nobody needed to be told what it was for.']] },

// Reading time: every caption stays up long enough to read (about 175 words a minute).
// Where the action under a caption is shorter than that, it first plays slower (up to
// STRETCH times), then holds its last pose for whatever time is still needed.
const READ = text => 1.2 + text.split(/\s+/).length / 2.9, STRETCH = 1.5;
for (const S of SHOTS) {
  const knots = [[0, 0]]; let real = 0, story = 0;
  S.realCaps = [];
  for (const [a, b, text] of S.caps) {
    real += a - story; story = a; knots.push([story, real]);
    const ra = real, avail = b - a, need = READ(text), k = Math.min(STRETCH, Math.max(1, need / avail));
    real += avail * k; story = b; knots.push([story, real]);
    if (need > avail * k) { real += need - avail * k; knots.push([story, real]); }
    S.realCaps.push([ra, real, text]);
  }
  real += S.dur - story; knots.push([S.dur, real]);
  S.knots = knots; S.real = real;
}
// Map time on the screen to time in the shot's own action.
function storyTime(S, r) {
  const k = S.knots;
  for (let i = 1; i < k.length; i++) if (r <= k[i][1]) { const [s0, r0] = k[i - 1], [s1, r1] = k[i]; return r1 > r0 ? s0 + (s1 - s0) * (r - r0) / (r1 - r0) : s1; }
  return S.dur;
}
const TOTAL = SHOTS.reduce((a, s) => a + s.real, 0);

function wrap(text, max) {
  const words = text.split(' '), lines = []; let line = '';
  for (const w of words) { const t = line ? line + ' ' + w : w; if (ctx.measureText(t).width > max && line) { lines.push(line); line = w; } else line = t; }
  if (line) lines.push(line);
  return lines;
}
function caption(text, a) {
  ctx.save(); ctx.globalAlpha = a;
  const g = ctx.createLinearGradient(0, H - 200, 0, H); g.addColorStop(0, 'rgba(15,12,10,0)'); g.addColorStop(.5, 'rgba(15,12,10,.5)'); g.addColorStop(1, 'rgba(15,12,10,.75)');
  ctx.fillStyle = g; ctx.fillRect(0, H - 200, W, 200);
  ctx.font = 'italic 27px ' + SERIF; ctx.textAlign = 'center'; ctx.textBaseline = 'alphabetic';
  const lines = wrap(text, 1000); let y = H - 46 - (lines.length - 1) * 36;
  ctx.shadowColor = 'rgba(0,0,0,.8)'; ctx.shadowBlur = 8; ctx.fillStyle = '#f5ecdb';
  for (const l of lines) { ctx.fillText(l, W / 2, y); y += 36; }
  ctx.restore();
}
const GRAIN = [0, 1, 2].map(k => {
  const c = document.createElement('canvas'); c.width = 320; c.height = 180;
  const g = c.getContext('2d'), im = g.createImageData(320, 180), r = R(55 + k);
  for (let i = 0; i < im.data.length; i += 4) { const v = 205 + r() * 50; im.data[i] = v; im.data[i + 1] = v * .985; im.data[i + 2] = v * .95; im.data[i + 3] = 255; }
  g.putImageData(im, 0, 0); return c;
});

function render(t) {
  BOIL = Math.floor(t * 8);
  let acc = 0, i = 0;
  while (i < SHOTS.length - 1 && t >= acc + SHOTS[i].real) { acc += SHOTS[i].real; i++; }
  const S = SHOTS[i], r = t - acc, u = storyTime(S, r);
  ctx.setTransform(1, 0, 0, 1, 0, 0); ctx.globalAlpha = 1; ctx.globalCompositeOperation = 'source-over';
  ctx.fillStyle = '#000'; ctx.fillRect(0, 0, cvs.width, cvs.height);
  ctx.setTransform(VIEW.k, 0, 0, VIEW.k, VIEW.ox, VIEW.oy);
  ctx.save(); ctx.beginPath(); ctx.rect(0, 0, W, H); ctx.clip();
  ctx.save(); S.draw(u); ctx.restore();
  ctx.save(); ctx.globalCompositeOperation = 'multiply'; ctx.globalAlpha = .4; ctx.drawImage(GRAIN[BOIL % 3], 0, 0, W, H); ctx.restore();
  const v = ctx.createRadialGradient(W / 2, H / 2, H * .45, W / 2, H / 2, H * 1.05);
  v.addColorStop(0, 'rgba(0,0,0,0)'); v.addColorStop(1, 'rgba(10,6,3,.45)'); ctx.fillStyle = v; ctx.fillRect(0, 0, W, H);
  const fade = Math.max(0, 1 - r / .5, 1 - (S.real - r) / .5);
  if (fade > 0) { ctx.fillStyle = `rgba(18,15,12,${fade})`; ctx.fillRect(0, 0, W, H); }
  for (const [a, b, text] of S.realCaps) {
    if (r > a && r < b) caption(text, Math.min(1, (r - a) / .35, (b - r) / .35));
  }
  ctx.restore();
}

function resize() {
  const dpr = Math.min(window.devicePixelRatio || 1, 2), cw = innerWidth, ch = innerHeight;
  cvs.width = Math.round(cw * dpr); cvs.height = Math.round(ch * dpr);
  cvs.style.width = cw + 'px'; cvs.style.height = ch + 'px';
  const k = Math.min(cw / W, ch / H) * dpr;
  VIEW = { k, ox: (cvs.width - W * k) / 2, oy: (cvs.height - H * k) / 2 };
}
const FIX = new URLSearchParams(location.search).get('t');
if (new URLSearchParams(location.search).has('debug')) {
  let a = 0; const msg = 'TOTAL ' + TOTAL.toFixed(1) + ' starts ' + SHOTS.map(S => { const x = a; a += S.real; return x.toFixed(1); }).join(','); console.log(msg); const pr = document.createElement('pre'); pr.id = 'timing'; pr.style.display = 'none'; pr.textContent = msg; document.body.appendChild(pr);
  addEventListener('error', e => { document.title = 'ERR ' + e.message + ' @' + e.lineno; const p = document.createElement('pre'); p.style.cssText = 'position:fixed;top:0;left:0;color:#f55;font:20px monospace;z-index:9'; p.textContent = e.message + ' line ' + e.lineno; document.body.appendChild(p); });
}
let clock = 0, last = null, paused = false;
let ended = false;
function frame(now) {
  if (last !== null && !paused && !ended) clock += Math.min(.1, (now - last) / 1000);
  last = now;
  if (clock >= TOTAL - .001) { clock = TOTAL - .001; ended = true; }
  render(clock);
  if (ended) endCard();
  requestAnimationFrame(frame);
}
// The film plays once and stops on its last (faded) frame with an offer to watch again.
function endCard() {
  ctx.setTransform(VIEW.k, 0, 0, VIEW.k, VIEW.ox, VIEW.oy);
  ctx.save(); ctx.font = 'italic 34px ' + SERIF; ctx.textAlign = 'center'; ctx.fillStyle = '#f5ecdb';
  ctx.fillText('↻  Watch again', W / 2, H / 2 + 12); ctx.restore();
}
function toggle() { if (ended) { clock = 0; ended = false; paused = false; } else paused = !paused; }
addEventListener('resize', () => { resize(); if (FIX !== null) render(parseFloat(FIX)); });
addEventListener('click', toggle);
addEventListener('keydown', e => { if (e.key === ' ') { toggle(); e.preventDefault(); } });
resize();
// A held frame is redrawn for its first second, in case the page is still being sized.
let held = 0;
function hold() { resize(); render(parseFloat(FIX)); if (++held < 60) requestAnimationFrame(hold); }
if (FIX !== null) hold(); else requestAnimationFrame(frame);
</script>
